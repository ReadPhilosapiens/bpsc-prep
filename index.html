<style>
:root{
  --bg:#111417;--surface:#191d21;--surface2:#21262b;--line:#2a3036;
  --text:#e9e6df;--muted:#8d939a;--accent:#7cc4a4;--accent-ink:#0e1a15;
  --warn:#d9a95b;--bad:#d97b6c;--r:16px;--accent-soft:#1e2e27;--bar:rgba(17,20,23,.94);--shadow:none;--bw:1px;color-scheme:dark;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--font)}
body{min-height:100vh;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent)}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.screen{display:none}.screen.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
.brand{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:40px}
.pill::after{content:" ▾";color:var(--muted)}
.hero{text-align:center;padding:10px 0 18px}
.ring{width:168px;height:168px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.next{font-size:19px;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:middle;font-weight:500}
.tag.h{color:var(--accent);background:var(--accent-soft)}
.main{display:block;width:100%;min-height:62px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:600;margin:6px 0 18px}
.main:active{opacity:.85}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.opt{min-height:52px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:500}
.opt:active{background:var(--line)}
.banner{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:14px}
.banner button{color:var(--accent);padding:10px 12px;font-weight:500}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
summary{list-style:none;padding:16px;min-height:54px;display:flex;justify-content:space-between;align-items:center;font-weight:500}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-size:20px}
details[open] summary::after{content:"–"}
.lines{padding:0 16px 14px;margin:0;list-style:none}
.lines li{padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.lines li:first-child{border-top:0}
.yr{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:8px;font-weight:500}
.topic{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);gap:10px;min-height:46px}
.lines .topic:first-child{border-top:0}
.st{font-size:12px;color:var(--muted);white-space:nowrap}
.st.ok{color:var(--accent)}.st.rev{color:var(--warn)}
.ch{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 16px 2px}
[data-theme=brutal] .ch{color:#111;font-weight:700}
.lvl{font-weight:600;font-size:15px;margin-top:6px}
.steps{margin:0 0 12px;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
[data-theme=brutal] .steps li::before{color:#111;border:2px solid #111;border-radius:0}
.quizcard .qmix{margin:4px 0 10px}
.qsubs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qsub{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:48px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:var(--bw) solid var(--line);font-size:14px;text-align:left}
.qsub b{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.qsub.done b{color:var(--accent)}
[data-theme=brutal] .qsub.done b{color:#111;text-decoration:underline}
.qtop{display:flex;justify-content:space-between;margin-bottom:8px}
.qbar{height:4px;border-radius:2px;background:var(--line);margin-bottom:18px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--accent)}
.qq{font-size:19px;font-weight:600;margin-bottom:16px;line-height:1.35}
.qopts{display:grid;gap:8px;margin-bottom:14px}
.qopt{min-height:52px;padding:12px 14px;border-radius:12px;background:var(--surface2);border:var(--bw) solid var(--line);text-align:left;font-size:16px}
.qopt.ok{border-color:var(--accent);background:var(--accent-soft)}
.qopt.bad{border-color:var(--bad);color:var(--bad)}
.qopt:disabled{opacity:1}
.qex{font-size:15px;color:var(--muted);margin-bottom:14px}.qex b{color:var(--text)}
.acc{display:grid;grid-template-columns:7.5em 1fr 3em;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.accbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.accbar i{display:block;height:100%}
.acc b{text-align:right;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--surface2);margin:6px 0 10px}
.seg button{min-height:40px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
[data-theme=brutal] .seg{border:2px solid #111;border-radius:0}[data-theme=brutal] .seg button{border-radius:0}
.planhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pacebtn{font-size:12px;color:var(--accent);padding:8px 0 8px 8px;min-height:36px;text-align:right}
[data-theme=brutal] .pacebtn{color:#111;text-decoration:underline}
.pitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);min-height:50px}
.plan .pitem:first-of-type{border-top:0}
.pchk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent-ink)}
.pitem.done .pchk{background:var(--accent);border-color:var(--accent)}
[data-theme=brutal] .pchk{border-radius:0;border-color:#111}
.ptxt{display:flex;flex-direction:column;min-width:0}
.ptag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
[data-theme=brutal] .ptag{color:#111;font-weight:700}
.pname{font-size:15px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:13px;color:var(--muted)}
.pitem.done .pname{text-decoration:line-through;color:var(--muted)}
.alldone{font-size:14px;color:var(--accent);padding:4px 0 6px}
.dateinp{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font:inherit;font-size:17px;padding:0 14px;margin-bottom:14px}
.banner.inst{border-style:solid;border-color:var(--accent);color:var(--text)}
.vtag{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
[data-theme=brutal] .vtag{color:#111;font-weight:700}
.vf{margin-bottom:12px}.vf summary{min-height:44px;padding:12px 16px;font-size:14px}
.pnl summary span{display:flex;flex-direction:column}.pnl summary small{color:var(--muted);font-weight:400;font-size:13px}
.vz{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vz .btn2{margin:0}
.ur{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",serif;font-size:17px;line-height:2.1;padding:4px 16px 14px;text-align:right;color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}
.tile{background:var(--surface);border:var(--bw) solid var(--line);border-radius:14px;padding:14px 8px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:var(--shadow)}
.tile b{font-size:15px;font-weight:600}.tile small{font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
.tile:active{opacity:.8}
.main.ghost{background:var(--surface);color:var(--text);border:var(--bw) solid var(--line)}
#startBtn{margin:0 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 18px}
.ring{width:124px;height:124px}.ring .big{font-size:36px}.ring .sub{font-size:12px;margin-top:2px}.hero{padding:0 0 12px}.hero>.sub{margin-top:4px}
#followUp .card{padding:12px 14px}#followUp .next{font-size:16px}#followUp .row3{margin-top:8px}#followUp .opt{min-height:44px}
.note{color:var(--muted);font-size:13px;padding:0 16px 14px}
h2{font-size:22px;margin:4px 0 16px;font-weight:600}
.day{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px;min-height:56px}
.entry .t{font-weight:500}.entry .m{font-size:13px;color:var(--muted)}
.dots{letter-spacing:2px;color:var(--accent);white-space:nowrap;font-size:13px}
.dots i{color:var(--line);font-style:normal}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:30px;font-weight:600;letter-spacing:-.01em}
.stat span{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:64px;margin-top:8px}
.bars div{background:var(--surface2);border-radius:4px;min-height:6px}
.bars div.on{background:var(--accent)}
.blabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}

const EXAM=Object.fromEntries(EXAMS.map(e=>[e.id,e]));

/* ---------- Storage ---------- */
const KEY="bpscprep.v1";
const DAY=864e5;
let S;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save")}}
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!Array.isArray(S.logs)){S={v:1,exam:"pcs",logs:sampleLogs()};save()}
  if(!EXAM[S.exam])S.exam="pcs";
}
function sampleLogs(){
  const now=Date.now(),at=(d,h)=>{const x=new Date(now-d*DAY);x.setHours(h,15,0,0);return x.getTime()};
  const s=[[7,19,"Pakistan Movement 1857–1947",4,"yes"],[6,20,"English précis & idioms",2,"shaky"],[6,21,"World GK",3,"yes"],
    [5,18,"Everyday Science (30 marks)",3,"no"],[4,20,"Balochistan GK",4,"yes"],[3,19,"Islamiat: Arkan & Seerah",5,"yes"],
    [2,21,"English essay",3,"yes"],[1,20,"Current affairs (last 2 months)",4,null]];
  return s.map((r,i)=>({id:"s"+i,t:at(r[0],r[1]),exam:"pcs",topic:r[2],sure:r[3],recall:r[4],sample:true}));
}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
function dayName(t){
  const diff=Math.round((startOfDay(Date.now())-startOfDay(t))/DAY);
  if(diff===0)return"Today";if(diff===1)return"Yesterday";
  return new Date(t).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
}
const dots=n=>"●".repeat(n)+"<i>"+"●".repeat(5-n)+"</i>";
const SURE=["","Lost","Shaky","Okay","Solid","Nailed it"];
const RECALL={yes:"Still clear",shaky:"Shaky",no:"Forgot"};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1800)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* topic status for current exam: ok | rev | null */
function status(examId,topic){
  const ls=S.logs.filter(l=>l.exam===examId&&l.topic===topic).sort((a,b)=>b.t-a.t);
  if(!ls.length)return null;
  const l=ls[0];
  return (l.sure>=3&&l.recall!=="no"&&l.recall!=="shaky")?"ok":"rev";
}
function coverage(examId){
  const e=EXAM[examId],n=e.topics.length;
  const done=e.topics.filter(t=>status(examId,t[0])==="ok").length;
  return {done,n,pct:Math.round(done/n*100)};
}
function nextTopic(examId){
  const e=EXAM[examId],order={H:0,M:1,L:2};
  const sorted=e.topics.slice().sort((a,b)=>order[a[1]]-order[b[1]]);
  const rev=sorted.find(t=>status(examId,t[0])==="rev");
  const fresh=sorted.find(t=>status(examId,t[0])===null);
  if(fresh&&(!rev||order[fresh[1]]<order[rev[1]]))return fresh;
  if(rev)return rev;
  /* all covered: oldest studied */
  let oldest=null,ot=Infinity;
  e.topics.forEach(t=>{const l=S.logs.filter(x=>x.exam===examId&&x.topic===t[0]);const m=Math.max(...l.map(x=>x.t));if(m<ot){ot=m;oldest=t}});
  return oldest;
}
function pendingFollowUp(){
  const today=startOfDay(Date.now());
  return S.logs.filter(l=>l.recall==null&&l.t<today&&l.t>=today-3*DAY).sort((a,b)=>b.t-a.t)[0];
}


/* ---------- Looks ---------- */
const LOOKS=[["minimal","Minimal","#111417"],["glass","Glass","#0d1022"],["paper","Paper","#f4f0e6"],["soft","Soft","#e4e8ee"],["brutal","Bold","#fffbea"],["neon","Neon","#05070a"]];
function applyLook(){
  const t=LOOKS.find(l=>l[0]===S.theme)||LOOKS[0];
  if(t[0]==="minimal")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t[0];
  document.querySelector('meta[name=theme-color]').setAttribute("content",t[2]);
  $("#looks").innerHTML=LOOKS.map(l=>`<button class="look lk-${l[0]}${l[0]===t[0]?" on":""}" data-look="${l[0]}"><i></i>${l[1]}</button>`).join("");
}

/* ---------- Render: Today ---------- */
function renderToday(){
  const e=EXAM[S.exam],c=coverage(S.exam);
  $("#examPill").textContent=e.name;
  if(booting){heroTarget=c.pct;$("#pct").textContent="0%";$("#arc").style.strokeDashoffset=276.5}
  else{$("#pct").textContent=c.pct+"%";$("#arc").style.strokeDashoffset=276.5*(1-c.pct/100)}
  $("#pctSub").textContent=c.done+" of "+c.n+" topics solid";
  renderInstall();
  $("#sampleBanner").innerHTML=S.logs.some(l=>l.sample)?'<div class="banner"><span>Showing a sample week</span><button id="clearSample">Clear samples</button></div>':"";
  const f=pendingFollowUp();
  $("#followUp").innerHTML=f?`<div class="card"><div class="label">${dayName(f.t)}: still clear?</div><div class="next">${esc(f.topic)}</div>
    <div class="row3"><button class="opt" data-r="yes">Yes</button><button class="opt" data-r="shaky">Shaky</button><button class="opt" data-r="no">Forgot</button></div></div>`:"";
  const pl=planFor();$("#plan").innerHTML=planCard(pl);
  const nx=planItems(pl).find(x=>!x.done),sb=$("#startBtn");
  if(nx){sb.textContent=(nx.k==="learn"?"Start: ":nx.k==="revise"?"Revise: ":"")+nx.t;sb.dataset.plan=nx.k;sb.dataset.pt=nx.q||nx.t;sb.classList.remove("ghost")}
  else{sb.textContent="Log extra study";delete sb.dataset.plan;sb.dataset.pt="";sb.classList.add("ghost")}
  const qd=Object.keys(QB).filter(k=>doneToday(k)).length;$("#tQuizSub").textContent=qd?qd+" of 8 done today":"8 subjects · "+LV[curLevel()][0];
  const vr=vivaReady();$("#tVivaSub").textContent=vr.ok?vr.ok+"/"+vr.n+" ready":"5,112 real Qs";
}

/* ---------- Render: History ---------- */
function renderHistory(){
  const ls=S.logs.slice().sort((a,b)=>b.t-a.t);
  if(!ls.length){$("#historyList").innerHTML='<div class="empty">Nothing logged yet.</div>';return}
  let html="",last="";
  ls.forEach(l=>{const k=dayKey(l.t);if(k!==last){html+=`<div class="day">${dayName(l.t)}</div>`;last=k}
    const ex=EXAM[l.exam]?EXAM[l.exam].name:l.exam;
    html+=`<button class="entry" data-id="${esc(l.id)}"><div><div class="t">${esc(l.topic)}</div><div class="m">${esc(ex)}${l.recall?" · "+RECALL[l.recall]:""}</div></div><span class="dots">${dots(l.sure)}</span></button>`});
  $("#historyList").innerHTML=html;
}

/* ---------- Render: Numbers ---------- */
function quizStats(){
  const agg={};(S.quiz||[]).forEach(r=>{for(const s in r.per){const a=agg[s]||(agg[s]={n:0,r:0});a.n+=r.per[s].n;a.r+=r.per[s].r}});
  const ks=Object.keys(QB).filter(k=>agg[k]);
  if(!ks.length)return `<div class="card"><div class="label">Quiz accuracy</div><div class="sub" style="margin:0">Take a daily quiz to see this.</div></div>`;
  return `<div class="card"><div class="label">Quiz accuracy by subject</div>${ks.sort((a,b)=>agg[a].r/agg[a].n-agg[b].r/agg[b].n).map(k=>{const p=Math.round(agg[k].r/agg[k].n*100);
    return `<div class="acc"><span>${esc(QB[k].name)}</span><span class="accbar"><i style="width:${p}%;background:${p<50?"var(--bad)":p<80?"var(--warn)":"var(--accent)"}"></i></span><b>${p}%</b></div>`}).join("")}</div>`;
}
function renderNumbers(){
  const c=coverage(S.exam),today=startOfDay(Date.now());
  const days=[];for(let i=13;i>=0;i--){const d=today-i*DAY;days.push(S.logs.filter(l=>l.t>=d&&l.t<d+DAY).length)}
  const max=Math.max(1,...days),studied=days.filter(x=>x).length;
  let streak=0;for(let i=13;i>=0;i--){if(days[i])streak++;else if(i===13)continue;else break}
  const answered=S.logs.filter(l=>l.recall);const kept=answered.filter(l=>l.recall==="yes").length;
  const recall=answered.length?Math.round(kept/answered.length*100)+"%":"—";
  const avg=S.logs.length?(S.logs.reduce((a,l)=>a+l.sure,0)/S.logs.length).toFixed(1):"—";
  const rev=EXAM[S.exam].topics.filter(t=>status(S.exam,t[0])==="rev");
  $("#numbers").innerHTML=`
   <div class="stats">
    <div class="stat"><b>${c.pct}%</b><span>paper covered</span></div>
    <div class="stat"><b>${recall}</b><span>still clear next day</span></div>
    <div class="stat"><b>${streak}</b><span>day streak</span></div>
    <div class="stat"><b>${avg}</b><span>avg sureness / 5</span></div>
   </div>
   <div class="card"><div class="label">Study days · ${studied} of last 14</div>
    <div class="bars">${days.map(n=>`<div class="${n?"on":""}" style="height:${n?Math.max(18,n/max*100):9}%"></div>`).join("")}</div>
    <div class="blabels"><span>2 weeks ago</span><span>Today</span></div></div>
   ${(()=>{const r=vivaReady();return `<div class="card"><div class="label">Viva readiness</div><div class="acc"><span>Common Qs</span><span class="accbar"><i style="width:${r.ok/r.n*100}%;background:var(--accent)"></i></span><b>${r.ok}/${r.n}</b></div></div>`})()}
   ${quizStats()}
   <div class="card"><div class="label">Revise these</div>${rev.length?`<div class="lines" style="padding:0">${rev.map(t=>`<button class="topic" data-improve="${esc(t[0])}"><span>${esc(t[0])}</span><span class="st rev">Fix it</span></button>`).join("")}</div>`:'<div class="sub" style="margin:0">Nothing weak yet.</div>'}</div>`;
}

function kindOf(topic,exam){
  if(exam&&exam.startsWith("lec-")&&!VIVA.some(v=>v[0]===topic)){
    if(/essay/i.test(topic))return"essay";if(/narration|voice|preposition/i.test(topic))return"english";return"subject"}
  const k=KINDS.find(k=>k[1].test(topic));return k?k[0]:"subject"}
function bandOf(l){if(l.sure<=2||l.recall==="no")return"low";if(l.sure===3||l.recall==="shaky")return"mid";return"high"}
const BAND={low:["Weak spot","var(--bad)"],mid:["Getting there","var(--warn)"],high:["Strong","var(--accent)"]};
function openImprove(l,extra){
  const band=bandOf(l),steps=STEPS[kindOf(l.topic,l.exam)][band],b=BAND[band];
  const why=l.recall?RECALL[l.recall]:SURE[l.sure];
  openSheet(`<div class="label">${dayName(l.t)} · ${esc(why)}</div>
   <div class="next">${esc(l.topic)}</div>
   <div class="lvl" style="color:${b[1]}">${b[0]}</div>
   <div class="label" style="margin-top:16px">Your next 3 steps</div>
   <ol class="steps">${steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>

   ${extra||'<button class="main" id="gotIt" style="margin:0">Got it</button>'}`);
}

  const band=pct<50?"low":pct<80?"mid":"high",bb=BAND[band],subj=Q.key==="mix"?weak:Q.key;
  const steps=STEPS[QKIND[subj]][band];
  openSheet(`<div class="label">${LV[Q.lv][0]} · ${Q.key==="mix"?"mixed quiz":esc(QB[Q.key].name)}</div>
   <div class="big" style="margin:6px 0 4px">${Q.right}/${n}</div>
   <div class="lvl" style="color:${bb[1]}">${bb[0]}${Q.key==="mix"&&weak&&wr<1?" · weakest: "+esc(QB[weak].name):""}</div>
   <div class="label" style="margin-top:16px">Your next 3 steps</div>
   <ol class="steps">${steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <div class="sub" style="margin:0 0 16px">${band==="high"&&Q.lv!=="h"?"Ready for "+LV[Q.lv==="e"?"m":"h"][0]+" tomorrow.":band==="low"&&Q.lv!=="e"?"Drop to "+LV[Q.lv==="h"?"m":"e"][0]+" until this feels easier.":"Missed questions come back first next time."}</div>
   <button class="main" id="qdone" style="margin:0">Done</button>`);
  Q=null;renderAll();
}


/* ---------- Today's plan ---------- */
function studiedToday(topic){const d=startOfDay(Date.now());return S.logs.some(l=>l.exam===S.exam&&l.topic===topic&&l.t>=d)}
function lastLogT(topic){const ls=S.logs.filter(l=>l.exam===S.exam&&l.topic===topic);return ls.length?Math.max(...ls.map(l=>l.t)):0}
function daysLeft(){const d=(S.dates||{})[S.exam];if(!d)return null;const t=new Date(d+"T00:00:00").getTime();return Math.round((t-startOfDay(Date.now()))/DAY)}
function pace(){const dl=daysLeft();if(dl==null||dl<1)return null;const c=coverage(S.exam),left=c.n-c.done;return {dl,left,per:Math.max(1,Math.ceil(left/dl))}}
function weakestSubject(){
  const agg={};(S.quiz||[]).forEach(r=>{for(const s in r.per){const a=agg[s]||(agg[s]={n:0,r:0});a.n+=r.per[s].n;a.r+=r.per[s].r}});
  const subs=Object.keys(QB),untried=subs.filter(k=>!agg[k]);
  const dayN=Math.floor(startOfDay(Date.now())/DAY);
  if(untried.length)return untried[dayN%untried.length];
  return subs.sort((a,b)=>agg[a].r/agg[a].n-agg[b].r/agg[b].n)[0];
}
function planFor(){
  const today=todayKey();
  if(S.plan&&S.plan.day===today&&S.plan.exam===S.exam)return S.plan;
  const e=EXAM[S.exam],order={H:0,M:1,L:2},sorted=e.topics.slice().sort((a,b)=>order[a[1]]-order[b[1]]);
  const pc=pace(),nLearn=Math.min(3,pc?pc.per:1);
  let learn=sorted.filter(t=>status(S.exam,t[0])===null).slice(0,nLearn).map(t=>t[0]);
  const weak=sorted.filter(t=>status(S.exam,t[0])==="rev").map(t=>t[0]).sort((a,b)=>lastLogT(a)-lastLogT(b));
  const stale=sorted.filter(t=>status(S.exam,t[0])==="ok"&&Date.now()-lastLogT(t[0])>=7*DAY).map(t=>t[0]).sort((a,b)=>lastLogT(a)-lastLogT(b));
  let revise=weak[0]||stale[0]||null;
  if(!learn.length)learn=sorted.map(t=>t[0]).filter(t=>t!==revise).sort((a,b)=>lastLogT(a)-lastLogT(b)).slice(0,1);
  S.plan={day:today,exam:S.exam,learn,revise,revWhy:weak[0]?"weak":"week",quiz:weakestSubject()};save();
  return S.plan;
}
function planItems(pl){
  const items=[];
  pl.learn.forEach(t=>items.push({k:"learn",t,done:studiedToday(t),tag:"Learn",sub:(EXAM[S.exam].topics.find(x=>x[0]===t)||[])[1]==="H"?"High-yield":"New topic"}));
  if(pl.revise)items.push({k:"revise",t:pl.revise,done:studiedToday(pl.revise),tag:"Revise",sub:pl.revWhy==="weak"?"Your weak spot":"Not seen in a week"});
  items.push({k:"viva",t:"Viva drill",q:"all",done:vivaToday(),tag:"Viva",sub:"5 real interview Qs · out loud"});
  if(pl.quiz&&QB[pl.quiz])items.push({k:"quiz",t:QB[pl.quiz].name+" quiz",q:pl.quiz,done:!!doneToday(pl.quiz),tag:"Quiz",sub:"5 Qs · "+LV[curLevel()][0]});
  return items;
}
function planCard(pl){
  const items=planItems(pl);
  const done=items.filter(i=>i.done).length,pc=pace(),dl=daysLeft();
  const paceTxt=dl==null?"Set exam date":dl<1?"Exam date passed":`${dl} day${dl===1?"":"s"} left · ${pc.per} topic${pc.per>1?"s":""}/day`;
  return `<div class="card plan"><div class="planhead"><div class="label" style="margin:0">Today's plan · ${done}/${items.length}</div>
    <button class="pacebtn" id="paceBtn">${esc(paceTxt)}</button></div>
    ${done===items.length?'<div class="alldone">All done for today. Well done.</div>':""}
    ${items.map(i=>`<button class="pitem${i.done?" done":""}" data-plan="${i.k}" data-pt="${esc(i.q||i.t)}">
      <span class="pchk">${i.done?"✓":""}</span>
      <span class="pname">${esc(i.t)}</span><span class="ptag">${i.tag}</span></button>`).join("")}</div>`;
}
function topUpPlan(){
  /* keep today's ticks; only add learn topics if the new pace needs more */
  if(!S.plan||S.plan.day!==todayKey()||S.plan.exam!==S.exam){S.plan=null;return}
  const pc=pace(),want=Math.min(3,pc?pc.per:1),order={H:0,M:1,L:2};
  const fresh=EXAM[S.exam].topics.slice().sort((a,b)=>order[a[1]]-order[b[1]]).map(t=>t[0])
    .filter(t=>status(S.exam,t)===null&&!S.plan.learn.includes(t)&&t!==S.plan.revise);
  while(S.plan.learn.length<want&&fresh.length)S.plan.learn.push(fresh.shift());
}
function openPace(){
  const cur=(S.dates||{})[S.exam]||"",min=new Date(Date.now()+DAY).toISOString().slice(0,10);
  openSheet(`<div class="label">${esc(EXAM[S.exam].name)}</div><div class="next" style="margin-bottom:14px">When is your exam?</div>
   <input type="date" id="examDate" min="${min}" value="${esc(cur)}" class="dateinp">
   <button class="main" id="saveDate" style="margin:0 0 8px">Save</button>
   ${cur?'<button class="btn2 quiet" id="clearDate">Remove date</button>':""}`);
}

l, and its difference from the 1919 Act; human development", "Sources of Islam — Quran, Hadith, Ijma, Qiyas", "Can Ijma be done today, given the many 'firqas' among 58 Muslim countries?", "Beliefs in Islam; the four revealed books — are we bound to follow the earlier ones (Zabur,", "The six authentic Hadith books (Sihah Sittah); the Hadith of Abu Hurairah", "Kuttab-e-Wahi (scribes of revelation); who wrote the Muwatta?", "Reasons for creating the One Unit; status of Balochistan at Partition (1947) and before", "Difference between Viceroy and Governor-General", "Why did constitution-making take so many years?", "At least three demands of the Simla Deputation", "What does the ozone layer protect against?", "The Chauri Chaura incident — year and reasons", "What is legislation, and what is a constitution?", "Fundamental rights; which rights were added by the 18th Amendment; why is it called a", "What is a Preamble? Difference between bicameral legislature and dyarchy", "When did Uzbekistan gain independence, and when did it join the UN?", "Which two Balochistan personalities did not sign the 1973 Constitution?", "Who discovered Australia, and when? A scientist who won three Nobel Prizes, in which subjects?", "Which cricket team first qualified for the (previous) World Cup?", "Age qualification for National Assembly and Senate membership; current number of general NA seats", "Introduction; family data", "Constitutional articles of the subcontinent and Pakistan", "Articles of the UNDHR; why did Pakistan decline to join certain articles?", "History of Guru Gobind Singh — which Guru in sequence after Guru Nanak?", "The 'City of Parks'; 'City of Mosques'; 'City of Bazaars'"]}, "qa": [{"q": "What is Iman-e-Mujmal?", "a": "ایمانِ مجمل ایمان کا مختصر بیان ہے: آمنتُ باللہ کما ھو باسمائہ وصفاتہ وقبلت جمیع احکامہ۔ یعنی میں اللہ پر اس طرح ایمان لایا جیسا کہ وہ اپنے ناموں اور صفات کے ساتھ ہے اور اس کے تمام احکام قبول کیے۔", "c": "Islamiat"}, {"q": "What is Iman-e-Mufassal?", "a": "ایمانِ مفصل میں ایمان کے تمام بنیادی اجزاء تفصیل سے بیان کیے جاتے ہیں: اللہ، فرشتوں، آسمانی کتابوں، رسولوں، آخرت اور تقدیر پر ایمان۔", "c": "Islamiat"}, {"q": "Difference between Iman-e-Mujmal and Iman-e-Mufassal?", "a": "ایمانِ مجمل ایمان کا مختصر اقرار ہے، جبکہ ایمانِ مفصل ایمان کے بنیادی عقائد کی تفصیلی وضاحت ہے۔", "c": "Islamiat"}, {"q": "What are the Articles of Faith?", "a": "اللہ، فرشتے، آسمانی کتابیں، انبیاء و رسل، آخرت اور تقدیر پر ایمان۔", "c": "Governance & politics"}, {"q": "What is the Fifth Kalima?", "a": "کلمۂ استغفار: استغفر اللہ ربی من کل ذنب اذنبتہ عمداً او خطاً...۔", "c": "Islamiat"}, {"q": "What is the meaning of Fifth Kalima?", "a": "اس میں انسان اللہ تعالیٰ سے اپنے تمام گناہوں کی معافی طلب کرتا اور اس کی طرف رجوع کرتا ہے۔", "c": "Islamiat"}, {"q": "What is Aqeedah-e-Akhirat?", "a": "آخرت پر عقیدہ یہ ہے کہ دنیاوی زندگی کے بعد دوبارہ اٹھایا جائے گا اور اعمال کا حساب ہوگا، پھر جنت یا جہنم کا فیصلہ ہوگا۔", "c": "Islamiat"}, {"q": "Effects of belief in Hereafter?", "a": "انسان میں ذمہ داری، تقویٰ، انصاف، صبر اور نیک اعمال کا جذبہ پیدا ہوتا ہے اور وہ ظلم و گناہ سے بچنے کی کوشش کرتا ہے۔", "c": "Islamiat"}, {"q": "Importance of Hijrah?", "a": "ہجرت نے مسلمانوں کو ظلم سے نکل کر ایک منظم اسلامی معاشرہ قائم کرنے کا موقع دیا اور مدینہ میں اسلامی ریاست کی بنیاد پڑی۔", "c": "Islamiat"}, {"q": "Why did Muslims migrate from Makkah to Madina?", "a": "مکہ میں مسلمانوں پر ظلم و ستم بڑھ گیا تھا؛ مدینہ کے لوگوں نے رسول ﷺ اور مسلمانوں کو پناہ اور حمایت دی، اس لیے ہجرت کی گئی۔", "c": "Islamiat"}, {"q": "Major events of Hijrah?", "a": "مکہ سے روانگی، غارِ ثور میں قیام، مدینہ کی طرف سفر، قباء پہنچنا اور پھر مدینہ منورہ میں داخل ہونا۔", "c": "Islamiat"}, {"q": "Causes of separation of East Pakistan?", "a": "سیاسی اختلافات، معاشی شکایات، لسانی و علاقائی مسائل، کمزور سیاسی مذاکرات، عسکری بحران اور بیرونی مداخلت اہم عوامل تھے۔", "c": "Balochistan & economy"}, {"q": "Political causes of Fall of Dhaka?", "a": "1970 کے انتخابات کے بعد اقتدار کی منتقلی پر سیاسی تعطل، باہمی عدم اعتماد اور مذاکرات کی ناکامی بنیادی عوامل تھے۔", "c": "History"}, {"q": "Economic causes of the Fall of Dhaka?", "a": "مشرقی پاکستان میں یہ احساس بڑھا کہ وسائل اور ترقی کے ثمرات منصفانہ طور پر تقسیم نہیں ہو رہے۔", "c": "History"}, {"q": "Geographical causes of the Fall of Dhaka?", "a": "دونوں حصوں کے درمیان تقریباً 1,600 کلومیٹر بھارتی علاقہ موجود تھا، جس سے انتظامی، دفاعی اور مواصلاتی مشکلات پیدا ہوئیں۔", "c": "History"}, {"q": "Role of India in 1971?", "a": "بھارت نے مکتی باہنی کی حمایت کی، مشرقی پاکستان سے آنے والے مہاجرین کو پناہ دی اور دسمبر 1971 میں براہِ راست جنگ میں شامل ہوا۔", "c": "History"}, {"q": "What was 1970 General Election?", "a": "یہ پاکستان کا پہلا عام انتخابات تھا جس میں عوامی لیگ نے مشرقی پاکستان میں اکثریت حاصل کی جبکہ مغربی پاکستان میں پیپلز پارٹی بڑی جماعت بنی۔", "c": "History"}, {"q": "What was Six-Point Programme?", "a": "شیخ مجیب الرحمن کا پروگرام تھا جس میں وسیع صوبائی خودمختاری، مالیاتی و اقتصادی اختیارات اور وفاق کو محدود اختیارات دینے کا مطالبہ شامل تھا۔", "c": "History"}, {"q": "Why was power not transferred to Sheikh Mujibur Rahman?", "a": "انتخابات کے نتائج کے بعد اقتدار کی منتقلی پر سیاسی اختلافات، مذاکرات کی ناکامی اور بڑھتے ہوئے بحران نے صورتحال کو انتہائی کشیدہ کر دیا۔", "c": "History"}, {"q": "Lessons from 1971?", "a": "جمہوری مینڈیٹ کا احترام، صوبائی حقوق، سیاسی مذاکرات، مساوی ترقی، قومی یکجہتی اور آئین کی بالادستی ضروری ہے۔", "c": "History"}, {"q": "What was Battle of Plassey?", "a": "1757 میں بنگال کے نواب سراج الدولہ اور برطانوی ایسٹ انڈیا کمپنی کے درمیان جنگ تھی۔", "c": "History"}, {"q": "When was Battle of Plassey fought?", "a": "23 جون 1757ء۔", "c": "History"}, {"q": "Who fought Battle of Plassey?", "a": "سراج الدولہ کی فوج اور رابرٹ کلائیو کی قیادت میں ایسٹ انڈیا کمپنی کی فوج۔", "c": "History"}, {"q": "Why did Siraj-ud-Daulah lose?", "a": "اندرونی غداری، خاص طور پر میر جعفر کی بے وفائی، کمپنی کی سازش اور فوجی و سیاسی کمزوری اہم عوامل تھے۔", "c": "History"}, {"q": "Role of Robert Clive?", "a": "رابرٹ کلائیو نے برطانوی فوج کی قیادت کی اور سازش و اتحاد کے ذریعے سراج الدولہ کو شکست دینے میں مرکزی کردار ادا کیا۔", "c": "History"}, {"q": "Significance of Battle of Plassey?", "a": "اس نے بنگال میں برطانوی سیاسی اثر و رسوخ کی بنیاد مضبوط کی اور ہندوستان میں برطانوی اقتدار کے پھیلاؤ کا اہم مرحلہ ثابت ہوئی۔", "c": "History"}, {"q": "What was Battle of Buxar?", "a": "1764ء کی جنگ جس میں ایسٹ انڈیا کمپنی نے مغل بادشاہ شاہ عالم ثانی، نوابِ اودھ اور نوابِ بنگال کی مشترکہ افواج کو شکست دی۔", "c": "History"}, {"q": "Difference between Plassey and Buxar?", "a": "پلاسی نے بنگال میں برطانوی اثر قائم کیا، جبکہ بक्सर کی فتح نے کمپنی کی سیاسی و مالی طاقت کو مزید مضبوط کر دیا۔", "c": "History"}, {"q": "Why was separate political party formed for Muslims?", "a": "مسلمانوں کے سیاسی، معاشی اور تعلیمی مفادات کے تحفظ اور مؤثر سیاسی نمائندگی کے لیے۔", "c": "Governance & politics"}, {"q": "Why was All-India Muslim League established?", "a": "1906ء میں مسلمانوں کے سیاسی حقوق اور مفادات کے تحفظ کے لیے مسلم لیگ قائم ہوئی۔", "c": "History"}, {"q": "Objectives of Muslim League?", "a": "مسلمانوں کے سیاسی حقوق کا تحفظ، برطانوی حکومت سے تعاون اور ہندو مسلم سیاسی مفادات کے درمیان توازن پیدا کرنا۔", "c": "History"}, {"q": "What is Two-Nation Theory?", "a": "برصغیر کے مسلمان اور ہندو مذہب، تہذیب، معاشرت اور تاریخی روایات کے اعتبار سے الگ قومیں ہیں؛ اسی تصور نے تحریکِ پاکستان کو فکری بنیاد فراہم کی۔", "c": "History"}, {"q": "What was Lahore Resolution?", "a": "23 مارچ 1940ء کو مسلم لیگ کے لاہور اجلاس میں منظور ہونے والی قرارداد جس میں مسلم اکثریتی علاقوں کے لیے آزاد سیاسی وحدتوں کا مطالبہ کیا گیا۔", "c": "History"}, {"q": "Significance of Lahore Resolution?", "a": "یہ تحریکِ پاکستان کا اہم سیاسی سنگِ میل بنی اور بعد میں قیامِ پاکستان کی جدوجہد کا بنیادی مطالبہ بن گئی۔", "c": "History"}, {"q": "Major developments during Zia-ul-Haq’s tenure?", "a": "اسلامائزیشن، حدود قوانین، زکوٰۃ و عشر کا نظام، افغان جنگ، 8ویں آئینی ترمیم اور غیر جماعتی انتخابات اہم واقعات تھے۔", "c": "History"}, {"q": "Islamization policy of General Zia-ul-Haq?", "a": "قوانین اور ریاستی اداروں میں اسلامی اصولوں کے نفاذ کے لیے مختلف اقدامات کیے گئے، جن میں حدود قوانین، زکوٰۃ و عشر اور اسلامی عدالتی اداروں کی توسیع شامل تھی۔", "c": "Islamiat"}, {"q": "What was Eighth Amendment?", "a": "1985ء کی آٹھویں ترمیم نے صدر کے اختیارات میں اضافہ کیا، جس میں اسمبلی توڑنے کا اختیار بھی شامل تھا؛ Article 58(2)(b) اس حوالے سے نمایاں تھا۔", "c": "History"}, {"q": "Importance of Local Government?", "a": "مقامی حکومت عوام کے قریب انتظامیہ، بنیادی خدمات، مقامی ترقی اور عوامی شمولیت کو بہتر بناتی ہے۔", "c": "Governance & politics"}, {"q": "Major problems of your district?", "a": "میرے ضلع کے اہم مسائل میں تعلیم، صحت، پانی، روزگار، سڑکوں اور بنیادی سہولیات کی کمی شامل ہیں۔ ان کے حل کے لیے مؤثر منصوبہ بندی، شفاف فنڈز اور بہتر انتظامیہ ضروری ہے۔", "c": "Personal & district"}, {"q": "Major resources of your district?", "a": "اس کا جواب اپنے ضلع کے مطابق دیں؛ مثال کے طور پر زراعت، معدنیات، مویشی، قدرتی وسائل، تجارت اور انسانی وسائل۔", "c": "Personal & district"}, {"q": "Major problems of Balochistan?", "a": "کمزور بنیادی ڈھانچہ، پانی کی کمی، کم شرحِ خواندگی، بے روزگاری، صحت کی سہولیات کی کمی، دور دراز آبادی اور امن و امان کے مسائل۔", "c": "Balochistan & economy"}, {"q": "Major sectors receiving funds in Balochistan budget?", "a": "تعلیم، صحت، آبپاشی، مواصلات و سڑکیں، امن و امان، زراعت، آب نوشی اور سماجی بہبود اہم شعبے ہیں۔", "c": "Balochistan & economy"}, {"q": "Development priorities of Balochistan?", "a": "انسانی ترقی، تعلیم و صحت، پانی، سڑکیں، توانائی، روزگار، زراعت، معدنیات اور امن و امان۔", "c": "Balochistan & economy"}, {"q": "Major issues between Pakistan and Afghanistan?", "a": "سرحدی انتظام، دہشت گردی، ٹی ٹی پی، غیر قانونی آمدورفت، مہاجرین، تجارت اور باہمی اعتماد کے مسائل۔", "c": "Current affairs"}, {"q": "Causes of Pak-Afghan tensions?", "a": "سرحدی تنازع، عسکریت پسندی، افغانستان میں مختلف حکومتوں کے ساتھ تعلقات، سرحدی واقعات اور باہمی عدم اعتماد۔", "c": "Current affairs"}, {"q": "What is Durand Line?", "a": "1893ء میں برطانوی ہندوستان اور افغانستان کے درمیان طے ہونے والی تقریباً 2,640 کلومیٹر طویل سرحدی لکیر ہے۔", "c": "Current affairs"}, {"q": "What is TTP issue?", "a": "تحریک طالبان پاکستان ایک کالعدم عسکری تنظیم ہے جس نے پاکستان میں دہشت گرد حملے کیے ہیں؛ ریاست کا مؤقف ہے کہ اس کے خلاف قانون اور قومی سلامتی کے تحت کارروائی ضروری ہے۔", "c": "Current affairs"}, {"q": "How can Pakistan improve relations with Afghanistan?", "a": "سفارتی مذاکرات، سرحدی انتظام، تجارت، قانونی آمدورفت، سیکیورٹی تعاون اور باہمی احترام کے ذریعے۔", "c": "Current affairs"}, {"q": "What is Strait of Hormuz?", "a": "خلیج فارس کو خلیج عمان اور بحیرہ عرب سے ملانے والی اہم بحری گزرگاہ ہے۔", "c": "Current affairs"}, {"q": "Why is the Strait of Hormuz important?", "a": "دنیا کی بڑی مقدار میں تیل اور گیس کی سمندری تجارت اس راستے سے گزرتی ہے۔", "c": "Current affairs"}, {"q": "Which countries are connected to Strait of Hormuz?", "a": "اس کے شمال میں ایران اور جنوب میں عمان/مسندم کا علاقہ واقع ہے۔", "c": "Current affairs"}, {"q": "Importance of the Strait of Hormuz for Pakistan?", "a": "پاکستان اپنی توانائی کی ضروریات کے لیے خلیج سے درآمدات کرتا ہے، اس لیے آبنائے ہرمز کی سلامتی اور کھلا رہنا اہم ہے۔", "c": "Current affairs"}, {"q": "What options are available to Chief Minister?", "a": "بہتر بجٹ ترجیحات، امن و امان، ترقیاتی منصوبے، تعلیم و صحت، مقامی حکومتوں کو مضبوط کرنا، سرمایہ کاری اور وفاق سے مؤثر رابطہ۔", "c": "Balochistan & economy"}, {"q": "Provincial autonomy?", "a": "صوبوں کو آئین کے تحت اپنے معاملات، وسائل اور انتظامی اختیارات استعمال کرنے کی آزادی صوبائی خودمختاری کہلاتی ہے۔", "c": "Governance & politics"}, {"q": "Good governance?", "a": "شفاف، جواب دہ، مؤثر، قانون کے مطابق اور عوامی ضروریات پر مبنی حکمرانی۔", "c": "Governance & politics"}, {"q": "Role of education in development?", "a": "تعلیم انسانی سرمایہ، روزگار، شعور، تحقیق، پیداوار اور سماجی ترقی میں اضافہ کرتی ہے۔", "c": "Balochistan & economy"}, {"q": "How reduce youth unemployment?", "a": "ٹیکنیکل تعلیم، vocational training، entrepreneurship، private investment اور صنعتوں کو فروغ دے کر۔", "c": "Balochistan & economy"}, {"q": "Improve security in Balochistan?", "a": "مؤثر intelligence، border management، قانون کی حکمرانی، پولیس کی استعداد، targeted کارروائی، ترقی اور سیاسی مکالمہ ضروری ہیں۔", "c": "Security"}, {"q": "What is Ghazwa?", "a": "وہ جنگ جس میں رسول اللہ ﷺ بنفسِ نفیس شریک ہوئے اسے غزوہ کہا جاتا ہے۔", "c": "Islamiat"}, {"q": "How many Ghazwas?", "a": "عام طور پر 27 غزوات کا ذکر ملتا ہے۔", "c": "Islamiat"}, {"q": "First Ghazwa?", "a": "غزوۂ وَدّان/ابواء، 2 ہجری۔", "c": "Islamiat"}, {"q": "Last Ghazwa?", "a": "غزوۂ تبوک، 9 ہجری۔", "c": "Islamiat"}, {"q": "In which battle did Muslims disobey command?", "a": "غزوۂ اُحد میں بعض تیر اندازوں نے اپنی مقررہ جگہ چھوڑ دی تھی۔", "c": "Balochistan & economy"}, {"q": "What happened in Battle of Uhud?", "a": "ابتدا میں مسلمانوں کو برتری حاصل ہوئی، مگر بعض تیر اندازوں کے مورچے چھوڑنے کے بعد حالات بدل گئے اور مسلمانوں کو نقصان اٹھانا پڑا۔", "c": "Islamiat"}, {"q": "Causes of Battle of Uhud?", "a": "قریش نے بدر کی شکست کا بدلہ لینے اور مسلمانوں کی طاقت کو ختم کرنے کے لیے مدینہ پر حملہ کیا۔", "c": "Islamiat"}, {"q": "Lessons from Uhud?", "a": "نظم و ضبط، قیادت کی اطاعت، صبر، ثابت قدمی اور دنیاوی مفاد سے بچنے کی اہمیت۔", "c": "Islamiat"}, {"q": "Battle of Badr?", "a": "17 رمضان 2 ہجری کو مسلمانوں اور قریش کے درمیان جنگ ہوئی جس میں مسلمانوں کو فتح حاصل ہوئی۔", "c": "Islamiat"}, {"q": "Importance of Badr?", "a": "یہ اسلام کی پہلی بڑی فیصلہ کن جنگ تھی اور مسلمانوں کی سیاسی و عسکری حیثیت مضبوط ہوئی۔", "c": "Islamiat"}, {"q": "Battle of Khandaq?", "a": "5 ہجری میں مدینہ کے دفاع کے لیے خندق کھودی گئی اور اتحادی لشکر ناکام واپس ہوا۔", "c": "Islamiat"}, {"q": "Treaty of Hudaybiyyah?", "a": "6 ہجری میں مسلمانوں اور قریش کے درمیان امن معاہدہ ہوا، جس نے بعد میں اسلام کے پھیلاؤ کے لیے سازگار ماحول پیدا کیا۔", "c": "Islamiat"}, {"q": "What is petroleum?", "a": "Petroleum زمین کے اندر پایا جانے والا قدرتی fossil fuel ہے جس میں crude oil اور natural gas شامل ہیں۔", "c": "Balochistan & economy"}, {"q": "What are hydrocarbons?", "a": "ایسے organic compounds جو بنیادی طور پر hydrogen اور carbon سے مل کر بنے ہوں hydrocarbons کہلاتے ہیں۔", "c": "Balochistan & economy"}, {"q": "How is petroleum formed?", "a": "قدیم جانداروں کے نامیاتی اجزا لاکھوں سال تک زمین کے اندر دباؤ اور حرارت کے زیرِ اثر تبدیل ہو کر hydrocarbons بناتے ہیں۔", "c": "Balochistan & economy"}, {"q": "How is natural gas formed?", "a": "قدیم organic matter کے طویل عرصے تک حرارت اور دباؤ کے زیرِ اثر decomposed ہونے سے قدرتی گیس بنتی ہے۔", "c": "Balochistan & economy"}, {"q": "Difference between crude oil and natural gas?", "a": "Crude oil مائع hydrocarbons کا مرکب ہے جبکہ natural gas بنیادی طور پر gaseous hydrocarbons، خصوصاً methane، پر مشتمل ہوتی ہے۔", "c": "Balochistan & economy"}, {"q": "How is oil extracted?", "a": "پہلے geological surveys اور seismic studies سے reservoir تلاش کیا جاتا ہے، پھر drilling کے ذریعے crude oil نکالا جاتا ہے۔", "c": "Balochistan & economy"}, {"q": "How is natural gas extracted?", "a": "gas reservoir تک well drill کر کے pressure یا production techniques کے ذریعے گیس نکالی جاتی ہے۔", "c": "Balochistan & economy"}, {"q": "What is drilling?", "a": "زمین میں مخصوص گہرائی تک borehole بنانا drilling کہلاتا ہے۔", "c": "Balochistan & economy"}, {"q": "What is an oil well?", "a": "ایسا drilled well جس سے commercial مقدار میں crude oil حاصل ہو۔", "c": "Balochistan & economy"}, {"q": "At what depth are oil and gas extracted?", "a": "گہرائی reservoir کے لحاظ سے مختلف ہوتی ہے؛ چند سو میٹر سے کئی کلومیٹر تک ہو سکتی ہے۔", "c": "Balochistan & economy"}, {"q": "Major oil fields of Pakistan?", "a": "Attock، Tal، Nashpa، Meyal اور Potwar region کے مختلف fields اہم ہیں۔", "c": "Balochistan & economy"}, {"q": "Major gas fields of Pakistan?", "a": "Sui، Mari، Uch، Kandhkot اور Qadirpur اہم gas fields میں شامل ہیں۔", "c": "Balochistan & economy"}, {"q": "Major oil/gas fields of Balochistan?", "a": "Sui، Uch اور بعض دوسرے exploration blocks اہم ہیں۔", "c": "Balochistan & economy"}, {"q": "What is Sui Gas Field?", "a": "Sui ایک بڑا قدرتی گیس کا میدان ہے جو پاکستان کی توانائی کی تاریخ میں بہت اہم ہے۔", "c": "Balochistan & economy"}, {"q": "Where is Sui Gas Field?", "a": "ضلع Dera Bugti، Balochistan میں واقع ہے۔", "c": "Balochistan & economy"}, {"q": "Importance of Sui Gas Field?", "a": "اس نے پاکستان کی صنعت، بجلی، گھریلو استعمال اور معیشت کو طویل عرصے تک گیس فراہم کی۔", "c": "Balochistan & economy"}, {"q": "What is Uch Gas Field?", "a": "Balochistan کا ایک اہم natural gas field ہے۔", "c": "Balochistan & economy"}, {"q": "Where is Uch Gas Field?", "a": "Dera Bugti district کے علاقے میں واقع ہے۔", "c": "Balochistan & economy"}, {"q": "Economic importance of gas fields?", "a": "روزگار، توانائی، صنعت، بجلی اور صوبائی و ملکی معیشت میں اہم کردار۔", "c": "Balochistan & economy"}, {"q": "Where is gas produced in Balochistan used?", "a": "گھریلو استعمال، صنعت، fertilizer، بجلی گھروں اور دیگر energy requirements میں۔", "c": "Balochistan & economy"}, {"q": "What is Uch Power Plant?", "a": "قدرتی گیس سے بجلی پیدا کرنے والا اہم power generation project ہے۔", "c": "Balochistan & economy"}, {"q": "Where is Uch Power Plant?", "a": "Dera Murad Jamali کے قریب Uch کے علاقے میں واقع ہے۔", "c": "Balochistan & economy"}, {"q": "Source of energy for Uch Power Plant?", "a": "بنیادی طور پر natural gas۔", "c": "Balochistan & economy"}, {"q": "Where is the electricity from Uch Power Plant used?", "a": "قومی grid کے ذریعے مختلف علاقوں کو بجلی فراہم کی جاتی ہے۔", "c": "Balochistan & economy"}, {"q": "Why is Balochistan not receiving sufficient benefit from resources?", "a": "کمزور infrastructure، limited local value addition، governance challenges، investment constraints اور تاریخی ترقیاتی پسماندگی اہم عوامل ہیں۔", "c": "Balochistan & economy"}, {"q": "What is CPEC?", "a": "China-Pakistan Economic Corridor چین کے Belt and Road Initiative کا اہم منصوبہ ہے جس میں infrastructure، energy، transport اور Gwadar سے متعلق منصوبے شامل ہیں۔", "c": "Current affairs"}, {"q": "When was CPEC launched?", "a": "CPEC کو باقاعدہ طور پر 2015ء میں نمایاں operational phase میں لایا گیا۔", "c": "Current affairs"}, {"q": "What is CPEC route?", "a": "چین کے Xinjiang سے پاکستان کے مختلف علاقوں کے ذریعے Gwadar تک road، rail، energy اور related connectivity کا مجموعہ۔", "c": "Current affairs"}, {"q": "What is CPEC's Western Route?", "a": "مغربی راستہ Khunjerab سے مختلف علاقوں سے گزرتا ہوا western Balochistan/Gwadar کی طرف جاتا ہے۔", "c": "Current affairs"}, {"q": "What is CPEC's Eastern Route?", "a": "زیادہ تر Punjab اور Sindh کے developed corridors سے گزرتا ہوا Gwadar کی طرف جاتا ہے۔", "c": "Current affairs"}, {"q": "What is CPEC's Central Route?", "a": "مرکزی corridor مختلف وسطی علاقوں کو CPEC connectivity سے جوڑنے کا تصور ہے۔", "c": "Current affairs"}, {"q": "How much area does CPEC cover?", "a": "یہ کسی ایک مخصوص “area” تک محدود نہیں؛ اس کے corridors اور projects پاکستان کے کئی صوبوں اور علاقوں میں پھیلے ہوئے ہیں۔", "c": "Current affairs"}, {"q": "Why Balochistan important for CPEC?", "a": "Gwadar، ساحلی محلِ وقوع، معدنی وسائل اور regional connectivity کی وجہ سے۔", "c": "Current affairs"}, {"q": "Importance of Gwadar?", "a": "Gwadar ایک deep-sea port ہے جو پاکستان، چین، Central Asia اور Middle East کے درمیان تجارت و connectivity میں اہم کردار ادا کر سکتا ہے۔", "c": "Current affairs"}, {"q": "Why is Balochistan lagging in development?", "a": "وسیع جغرافیہ، کم آبادی کا پھیلاؤ، infrastructure کی کمی، کم سرمایہ کاری اور انسانی ترقی کے مسائل اہم عوامل ہیں۔", "c": "Balochistan & economy"}, {"q": "How can Balochistan's development be accelerated?", "a": "education، health، roads، water، digital connectivity، skills، investment، local industries اور transparent governance پر توجہ دی جائے۔", "c": "Balochistan & economy"}, {"q": "Major development issues of Jaffarabad?", "a": "سیلاب، drainage، آبپاشی، زرعی infrastructure، صحت، تعلیم اور سڑکیں اہم مسائل ہیں۔", "c": "Balochistan & economy"}, {"q": "Major livelihood sources of Jaffarabad?", "a": "زراعت، livestock، تجارت اور متعلقہ کاروبار۔", "c": "Balochistan & economy"}, {"q": "Major agricultural crops of Jaffarabad?", "a": "wheat، rice، vegetables اور مختلف cash/seasonal crops۔", "c": "Balochistan & economy"}, {"q": "Role of MPA?", "a": "صوبائی اسمبلی میں قانون سازی، صوبائی بجٹ اور عوامی مسائل کی نمائندگی۔", "c": "Governance & politics"}, {"q": "MPA vs MNA?", "a": "MPA صوبائی اسمبلی کا رکن ہوتا ہے جبکہ MNA قومی اسمبلی کا؛ MNA وفاقی سطح کی قانون سازی اور قومی معاملات میں کردار ادا کرتا ہے۔", "c": "Governance & politics"}, {"q": "Status of female education in Balochistan?", "a": "بلوچستان میں خواتین کی تعلیم میں بہتری کی گنجائش ہے، خاص طور پر rural اور remote areas میں۔", "c": "Balochistan & economy"}, {"q": "Why gap in female education?", "a": "فاصلے، اسکولوں کی کمی، poverty، social attitudes، female teachers کی کمی اور transportation مسائل۔", "c": "Balochistan & economy"}, {"q": "Barriers to female education?", "a": "غربت، فاصلے، security، معاشرتی رکاوٹیں اور بنیادی سہولیات کی کمی۔", "c": "Balochistan & economy"}, {"q": "How improve female education?", "a": "girls’ schools، female teachers، scholarships، transport، safe learning environment اور community awareness۔", "c": "Balochistan & economy"}, {"q": "Minerals in Chagai?", "a": "copper، gold، iron ore اور دیگر معدنی وسائل۔", "c": "Balochistan & economy"}, {"q": "What is Reko Diq?", "a": "Chagai district میں واقع ایک بڑا copper-gold mineral deposit/project ہے۔", "c": "Balochistan & economy"}, {"q": "What is Saindak?", "a": "Chagai میں copper-gold mining project ہے۔", "c": "Balochistan & economy"}, {"q": "Difference Reko Diq and Saindak?", "a": "دونوں Chagai کے copper-gold projects ہیں، لیکن Reko Diq کا mineral deposit اور project scale بہت بڑا سمجھا جاتا ہے۔", "c": "Balochistan & economy"}, {"q": "Where is Juniper Forest?", "a": "Ziarat کے علاقے میں مشہور قدیم juniper forests موجود ہیں۔", "c": "Balochistan & economy"}, {"q": "Juniper forests besides Ziarat?", "a": "بلوچستان کے بعض دوسرے بلند و سرد علاقوں، خصوصاً Ziarat-Balochistan mountain belt میں بھی juniper stands پائے جاتے ہیں۔", "c": "History"}, {"q": "Why Ziarat important?", "a": "قائداعظم کی تاریخی رہائش، Juniper forests اور قدرتی و سیاحتی اہمیت کی وجہ سے۔", "c": "History"}, {"q": "Environmental importance of Juniper forests?", "a": "biodiversity، soil protection، carbon storage اور ecosystem stability میں اہم کردار ادا کرتے ہیں۔", "c": "Balochistan & economy"}, {"q": "Environmental problems of Balochistan?", "a": "water scarcity، drought، desertification، deforestation، soil degradation اور climate change۔", "c": "Balochistan & economy"}, {"q": "How can natural resources drive Balochistan's development?", "a": "مقامی processing، jobs، infrastructure، royalties، education اور skills development کے ذریعے وسائل کو پائیدار معاشی ترقی میں تبدیل کیا جا سکتا ہے۔", "c": "Balochistan & economy"}, {"q": "What should be the government's priority in Balochistan?", "a": "human development، water، education، health، infrastructure، jobs، security اور transparent resource management۔", "c": "Balochistan & economy"}, {"q": "Significance of Treaty of Hudaybiyyah?", "a": "اس نے قریش کے ساتھ امن قائم کیا، مسلمانوں کو سیاسی recognition ملی اور دعوتِ اسلام کے لیے وسیع مواقع پیدا ہوئے۔", "c": "Islamiat"}, {"q": "Importance of Hijrat-e-Madina?", "a": "اسلامی ریاست اور منظم مسلم معاشرے کی بنیاد رکھی گئی اور اسلامی calendar بھی ہجرت سے منسوب ہوا۔", "c": "Islamiat"}, {"q": "Why Prophet ﷺ migrated?", "a": "مکہ میں شدید ظلم و مخالفت کے باعث اور مدینہ کے لوگوں کی حمایت و دعوت پر۔", "c": "Islamiat"}, {"q": "Route of Hijrah?", "a": "مکہ سے غارِ ثور، پھر ساحلی راستے سے مدینہ کی طرف سفر کیا گیا۔", "c": "Islamiat"}, {"q": "Where stayed during Hijrah?", "a": "غارِ ثور میں تقریباً تین راتیں قیام کیا، پھر مدینہ کی طرف روانہ ہوئے۔", "c": "Islamiat"}, {"q": "Role of Hazrat Abu Bakrؓ?", "a": "رسول اللہ ﷺ کے رفیقِ سفر تھے اور غارِ ثور میں آپ ﷺ کے ساتھ رہے۔", "c": "Islamiat"}, {"q": "Task of Hazrat Aliؓ?", "a": "مکہ میں رسول ﷺ کی امانتیں لوگوں تک پہنچانا اور آپ ﷺ کے بستر پر سو کر دشمنوں کو گمراہ کرنا۔", "c": "Islamiat"}, {"q": "Role of Abdullah bin Abu Bakrؓ?", "a": "دن میں مکہ کی خبریں لے کر غارِ ثور پہنچاتے تھے۔", "c": "Islamiat"}, {"q": "Role of Asma bint Abu Bakrؓ?", "a": "سفر کے لیے کھانا پہنچانے میں مدد کی؛ اسی نسبت سے انہیں ذات النطاقین کہا جاتا ہے۔", "c": "Islamiat"}, {"q": "Cave of Thawr?", "a": "رسول اللہ ﷺ اور حضرت ابوبکرؓ نے ہجرت کے دوران وہاں قیام کیا؛ قریش تلاش کرتے ہوئے غار کے قریب تک پہنچ گئے تھے۔", "c": "Islamiat"}, {"q": "Charter of Madina?", "a": "مدینہ میں مختلف قبائل اور مذہبی گروہوں کے درمیان حقوق و ذمہ داریوں اور باہمی دفاع کے اصول طے کرنے والا معاہدہ تھا۔", "c": "Islamiat"}, {"q": "What is Tawheed?", "a": "اللہ تعالیٰ کو ذات، صفات اور عبادت میں واحد ماننا۔", "c": "Islamiat"}, {"q": "Types of Tawheed?", "a": "عام طور پر توحیدِ ربوبیت، توحیدِ الوہیت اور توحیدِ اسماء و صفات بیان کی جاتی ہیں۔", "c": "Islamiat"}, {"q": "Deen vs religion?", "a": "Deen اسلام میں مکمل طرزِ زندگی، عقیدہ، عبادات، اخلاق اور معاملات کو شامل کرتا ہے؛ religion کا استعمال عموماً مذہبی عقائد و عبادات کے لیے وسیع معنوں میں ہوتا ہے۔", "c": "Islamiat"}, {"q": "Why Islam complete code of life?", "a": "اسلام عقائد و عبادات کے ساتھ اخلاق، خاندان، معاشرت، معاملات، عدل اور اجتماعی زندگی کے اصول بھی فراہم کرتا ہے۔", "c": "Islamiat"}, {"q": "What is Surah Al-Ikhlas?", "a": "قرآن مجید کی 112ویں سورت، جو اللہ کی وحدانیت اور بے نیازی بیان کرتی ہے۔", "c": "Islamiat"}, {"q": "Why was Surah Al-Ikhlas revealed?", "a": "اللہ تعالیٰ کی ذات و صفات کے بارے میں سوالات کے جواب میں اس کے بنیادی عقیدۂ توحید کو واضح کیا گیا۔", "c": "Islamiat"}, {"q": "Meaning of Surah Al-Ikhlas?", "a": "اللہ ایک ہے، بے نیاز ہے، نہ اس کی کوئی اولاد ہے نہ وہ کسی کی اولاد ہے، اور کوئی اس کا ہمسر نہیں۔", "c": "Islamiat"}, {"q": "Why Surah Al-Kausar revealed?", "a": "رسول اللہ ﷺ کو تسلی اور خیرِ کثیر کی بشارت دینے کے لیے۔", "c": "Islamiat"}, {"q": "Meaning of Al-Kausar?", "a": "بہت زیادہ خیر؛ احادیث میں حوضِ کوثر کا بھی ذکر ہے۔", "c": "Islamiat"}, {"q": "What is Hauz-e-Kausar?", "a": "قیامت کے دن رسول اللہ ﷺ کو عطا ہونے والا حوض۔", "c": "Islamiat"}, {"q": "Who will drink from Hauz-e-Kausar?", "a": "احادیث کے مطابق رسول اللہ ﷺ کی امت کے وہ لوگ جو آپ ﷺ کی اتباع پر قائم رہے۔", "c": "Islamiat"}, {"q": "Two-Nation Theory?", "a": "برصغیر میں مسلمانوں کو مذہب، تہذیب اور اجتماعی شناخت کے لحاظ سے ایک الگ قوم سمجھنے کا سیاسی تصور۔", "c": "History"}, {"q": "Why separate homeland?", "a": "مسلمانوں نے اپنے سیاسی، مذہبی، ثقافتی اور معاشی مفادات کے تحفظ کے لیے الگ سیاسی نظام کا مطالبہ کیا۔", "c": "History"}, {"q": "Why Muslim League formed?", "a": "مسلمانوں کے سیاسی حقوق اور مفادات کے تحفظ کے لیے۔", "c": "History"}, {"q": "Which book impressed you the most?", "a": "Why Nations Fail نے مجھے زیادہ متاثر کیا کیونکہ یہ بتاتی ہے کہ inclusive institutions معاشی اور سیاسی ترقی میں اہم کردار ادا کرتے ہیں۔", "c": "Balochistan & economy"}, {"q": "What is Why Nations Fail?", "a": "یہ Daron Acemoglu اور James A. Robinson کی کتاب ہے جو بتاتی ہے کہ قوموں کی ترقی یا زوال میں سیاسی اور معاشی اداروں کا بنیادی کردار ہوتا ہے۔", "c": "Governance & politics"}, {"q": "Who are the authors of Why Nations Fail?", "a": "Daron Acemoglu اور James A. Robinson۔", "c": "Governance & politics"}, {"q": "Main theme of Why Nations Fail?", "a": "کتاب کا مرکزی خیال یہ ہے کہ inclusive political and economic institutions ترقی کو فروغ دیتے ہیں جبکہ extractive institutions ترقی کو روکتی ہیں۔", "c": "Governance & politics"}, {"q": "What are inclusive institutions?", "a": "ایسے سیاسی و معاشی ادارے جو زیادہ سے زیادہ لوگوں کو مواقع، حقوق، سیاسی شرکت اور معاشی سرگرمیوں میں حصہ لینے کا موقع دیں۔", "c": "Governance & politics"}, {"q": "What are extractive institutions?", "a": "ایسے ادارے جن میں طاقت اور وسائل محدود اشرافیہ کے ہاتھ میں مرتکز ہوں اور عام لوگوں کے مواقع محدود ہوں۔", "c": "Governance & politics"}, {"q": "How can Why Nations Fail be related to Pakistan?", "a": "پاکستان میں مضبوط قانون، merit، accountability، inclusive political participation، property rights اور مساوی معاشی مواقع institutional development کو بہتر بنا سکتے ہیں۔", "c": "Governance & politics"}, {"q": "How do you see the political system of Pakistan?", "a": "پاکستان ایک وفاقی پارلیمانی جمہوری نظام ہے جس میں آئین، پارلیمنٹ، عدلیہ اور صوبائی حکومتیں اہم کردار ادا کرتی ہیں۔", "c": "Governance & politics"}, {"q": "Major weaknesses of Pakistan’s political system?", "a": "سیاسی عدم استحکام، کمزور institutional continuity، polarization، governance issues اور بعض اوقات rule of law کا کمزور نفاذ۔", "c": "Governance & politics"}, {"q": "What is political instability?", "a": "جب حکومت، سیاسی اداروں یا پالیسیوں میں بار بار اور غیر یقینی تبدیلیاں ہوں اور سیاسی نظام مستقل طور پر مؤثر انداز میں کام نہ کر سکے تو اسے political instability کہتے ہیں۔", "c": "Governance & politics"}, {"q": "Causes of political instability in Pakistan?", "a": "سیاسی polarization، ادارہ جاتی کشمکش، کمزور سیاسی جماعتیں، معاشی بحران، governance issues اور عدم اعتماد اہم عوامل ہیں۔", "c": "Governance & politics"}, {"q": "Suggestions to improve Pakistan’s political system?", "a": "آئین کی بالادستی، مضبوط پارلیمانی ادارے، آزاد و مؤثر ادارے، electoral reforms، political dialogue، accountability اور rule of law۔", "c": "Governance & politics"}, {"q": "What is good governance?", "a": "ایسی حکمرانی جو شفاف، جواب دہ، مؤثر، قانون کے مطابق، عوام دوست اور participatory ہو۔", "c": "Governance & politics"}, {"q": "What is rule of law?", "a": "اس اصول کا مطلب ہے کہ ریاست میں ہر شخص اور ادارہ قانون کے تابع ہو اور قانون کا اطلاق بلاامتیاز ہو۔", "c": "Governance & politics"}, {"q": "What is institutional development?", "a": "اداروں کی capacity، efficiency، transparency، accountability اور professional functioning کو بہتر بنانا institutional development ہے۔", "c": "Governance & politics"}, {"q": "What is democracy?", "a": "ایسا نظامِ حکومت جس میں عوام براہِ راست یا اپنے منتخب نمائندوں کے ذریعے حکمرانی میں حصہ لیتے ہیں۔", "c": "Governance & politics"}, {"q": "What is federalism?", "a": "ایسا نظام جس میں آئین کے تحت اختیارات وفاق اور صوبوں کے درمیان تقسیم ہوتے ہیں۔", "c": "Islamiat"}, {"q": "What is provincial autonomy?", "a": "صوبوں کو آئین کے دائرے میں اپنے انتظامی، قانون سازی اور مالی معاملات میں اختیار حاصل ہونا provincial autonomy ہے۔", "c": "Governance & politics"}, {"q": "Are you disappointed with the current situation of Mastung?", "a": "جی، اگر کسی علاقے میں امن و امان، تعلیم، صحت یا روزگار کے مسائل ہوں تو تشویش ضرور ہوتی ہے۔ لیکن میں مسئلے کے ساتھ ساتھ practical solutions پر بھی توجہ دینے کو ترجیح دوں گا۔", "c": "Security"}, {"q": "Major problems of Mastung?", "a": "امن و امان، پانی، روزگار، تعلیم، صحت، infrastructure اور بعض علاقوں میں بنیادی سہولیات کی کمی اہم مسائل ہیں۔", "c": "Security"}, {"q": "Why has Mastung become a centre of insurgency?", "a": "اس سوال کا متوازن جواب یہ ہے کہ security challenges کے پیچھے کئی عوامل ہوتے ہیں، جن میں جغرافیہ، governance gaps، سیاسی شکایات، معاشی محرومی اور militant networks شامل ہو سکتے ہیں۔", "c": "Security"}, {"q": "Causes of insurgency in Balochistan?", "a": "سیاسی و معاشی شکایات، احساسِ محرومی، governance gaps، کم ترقی، security issues اور بیرونی/مسلح گروہوں کی سرگرمیاں مختلف ادوار میں عوامل رہی ہیں۔", "c": "Security"}, {"q": "How can insurgency be controlled?", "a": "صرف security operation کافی نہیں؛ law enforcement کے ساتھ political dialogue، justice، development، employment، education اور effective governance بھی ضروری ہیں۔", "c": "Security"}, {"q": "What is terrorism?", "a": "سیاسی یا نظریاتی مقصد کے لیے شہریوں یا ریاست میں خوف پیدا کرنے کے لیے تشدد یا تشدد کی دھمکی کا استعمال terrorism کہلاتا ہے۔", "c": "Security"}, {"q": "Difference between terrorism and insurgency?", "a": "Insurgency ریاست کے خلاف منظم مسلح بغاوت یا control حاصل کرنے کی کوشش ہے، جبکہ terrorism میں خوف پیدا کرنے کے لیے تشدد بنیادی حربہ ہوتا ہے۔ دونوں بعض حالات میں overlap کر سکتے ہیں۔", "c": "Security"}, {"q": "What is climate change?", "a": "طویل عرصے تک temperature، rainfall اور weather patterns میں نمایاں تبدیلی climate change کہلاتی ہے۔", "c": "Balochistan & economy"}, {"q": "Causes of climate change?", "a": "fossil fuels کا استعمال، greenhouse gas emissions، deforestation اور land-use changes بڑے انسانی عوامل ہیں۔", "c": "Balochistan & economy"}, {"q": "How is climate change affecting Balochistan?", "a": "drought، water scarcity، heatwaves، irregular rainfall، floods، agriculture losses اور desertification کے خطرات بڑھتے ہیں۔", "c": "Balochistan & economy"}, {"q": "What is water scarcity?", "a": "جب کسی علاقے میں دستیاب پانی اس کی آبادی اور ضروریات کے مقابلے میں ناکافی ہو تو water scarcity کہلاتی ہے۔", "c": "Balochistan & economy"}, {"q": "What is desertification?", "a": "خشک اور نیم خشک علاقوں میں زمین کی productivity کا مسلسل کم ہونا اور زمین کا degradation کی طرف جانا desertification ہے۔", "c": "Balochistan & economy"}, {"q": "What is Koh-e-Sulaiman Range?", "a": "یہ پاکستان کے مغربی حصے میں واقع ایک اہم mountain range ہے جو بلوچستان، خیبر پختونخوا اور پنجاب کے علاقوں کے قریب/درمیان پھیلا ہوا ہے۔", "c": "Islamiat"}, {"q": "Where is Koh-e-Sulaiman Range located?", "a": "اس کا بڑا حصہ بلوچستان کے مشرقی حصوں اور پنجاب/خیبر پختونخوا کے ملحقہ علاقوں میں واقع ہے۔", "c": "Islamiat"}, {"q": "What is Leviathan?", "a": "Leviathan Thomas Hobbes کی مشہور سیاسی فلسفے کی کتاب ہے، جو 1651ء میں شائع ہوئی۔", "c": "Governance & politics"}, {"q": "What does Leviathan mean?", "a": "Leviathan ایک عظیم سمندری مخلوق کا نام ہے؛ Hobbes نے اسے طاقتور sovereign/state کے استعارے کے طور پر استعمال کیا۔", "c": "Governance & politics"}, {"q": "Who wrote Leviathan?", "a": "Thomas Hobbes۔", "c": "Governance & politics"}, {"q": "Main theme of Hobbes’s Leviathan?", "a": "Hobbes کے مطابق انسانوں کی باہمی conflict سے بچنے کے لیے ایک مضبوط sovereign authority ضروری ہے جو امن اور order قائم رکھے۔", "c": "Governance & politics"}, {"q": "What does Islam mean?", "a": "اسلام کا بنیادی مفہوم اللہ کے سامنے submission، اطاعت اور اس کے احکامات کے مطابق زندگی گزارنا ہے۔", "c": "Islamiat"}, {"q": "Why is Islam called a complete code of life?", "a": "کیونکہ اسلام عقیدہ اور عبادات کے ساتھ اخلاق، خاندان، معاملات، معاشرت، عدل اور اجتماعی زندگی کے اصول بھی فراہم کرتا ہے۔", "c": "Islamiat"}, {"q": "What are the five pillars of Islam?", "a": "کلمۂ شہادت، نماز، روزہ، زکوٰۃ اور حج۔", "c": "Islamiat"}, {"q": "Which Prophet’s name is mentioned most frequently in the Holy Quran?", "a": "قرآن میں حضرت موسیٰؑ کا نام سب سے زیادہ مرتبہ آیا ہے۔", "c": "Islamiat"}, {"q": "How many times is the name Muhammad ﷺ mentioned in the Holy Quran?", "a": "نام محمد ﷺ چار مرتبہ آیا ہے؛ جبکہ احمد ایک مرتبہ آیا ہے۔", "c": "Islamiat"}, {"q": "Importance of Aqeedah in Islam?", "a": "عقیدہ اسلام کے بنیادی beliefs کی بنیاد ہے؛ درست عقیدہ انسان کی عبادات، اخلاق اور زندگی کے تصور کو direction دیتا ہے۔", "c": "Islamiat"}, {"q": "Difference between Deen and religion?", "a": "Deen ایک مکمل نظامِ زندگی کا تصور پیش کرتا ہے، جبکہ religion عام طور پر عقائد اور عبادات کے مذہبی نظام کے لیے استعمال ہوتا ہے۔", "c": "Islamiat"}, {"q": "What was Simla Deputation?", "a": "1906ء میں مسلم رہنماؤں کا وفد آغا خان کی قیادت میں وائسرائے Lord Minto سے ملا اور مسلمانوں کے سیاسی حقوق اور جداگانہ نمائندگی کا مطالبہ کیا۔", "c": "History"}, {"q": "What was Lucknow Pact?", "a": "1916ء میں مسلم لیگ اور کانگریس کے درمیان سیاسی معاہدہ تھا جس میں مسلمانوں کے جداگانہ انتخاب اور بعض آئینی مطالبات کو تسلیم کیا گیا۔", "c": "History"}, {"q": "What were Delhi Proposals?", "a": "1927ء میں قائداعظم کی طرف سے آئینی سمجھوتے کے لیے پیش کردہ تجاویز تھیں جن میں مسلمانوں کے سیاسی حقوق کے تحفظ کے بدلے بعض مطالبات پر flexibility دکھائی گئی۔", "c": "History"}, {"q": "What was Nehru Report?", "a": "1928ء میں Motilal Nehru کی سربراہی میں تیار کردہ آئینی رپورٹ تھی جس میں ہندوستان کے لیے آئینی نظام کی تجاویز دی گئیں۔", "c": "History"}, {"q": "Why did Jinnah reject Nehru Report?", "a": "کیونکہ قائداعظم کے مطابق رپورٹ میں مسلمانوں کے اہم سیاسی مطالبات، خصوصاً جداگانہ انتخاب اور مؤثر مسلم safeguards، مناسب طور پر تسلیم نہیں کیے گئے۔", "c": "History"}, {"q": "What were Jinnah’s Fourteen Points?", "a": "یہ مسلمانوں کے آئینی اور سیاسی حقوق کے تحفظ کے لیے 1929ء میں قائداعظم کی پیش کردہ 14 تجاویز تھیں۔ ان میں وفاقی نظام، صوبائی خودمختاری، جداگانہ انتخابات، مسلم نمائندگی اور مذہبی و ثقافتی حقوق جیسے مطالبات شامل تھے۔", "c": "History"}, {"q": "Please introduce yourself.", "a": "اپنا نام، ضلع، تعلیم، تجربہ اور مختصر career objective بتائیں۔ آخر میں کہیں: “I want to serve the people through transparent, lawful and efficient administration.”", "c": "Personal & district"}, {"q": "What is your educational background?", "a": "اپنی degree، university، سالِ تکمیل اور relevant subjects مختصر طور پر بتائیں۔", "c": "Personal & district"}, {"q": "What questions can be asked about your degree?", "a": "بنیادی concepts، اہم subjects، practical applications، thesis/project اور آپ کی degree کا administrative job سے تعلق پوچھا جا سکتا ہے۔", "c": "Personal & district"}, {"q": "What is the origin of your city’s name?", "a": "اپنے شہر کے نام کی تاریخی وجہ اور معتبر تاریخی روایت بتائیں؛ غیر یقینی روایت کو fact کے طور پر بیان نہ کریں۔", "c": "Personal & district"}, {"q": "Solutions to your district's problems?", "a": "infrastructure، education، healthcare، water management، jobs، local governance، transparency اور targeted development projects۔", "c": "Personal & district"}, {"q": "What is feudalism?", "a": "ایسا معاشرتی و معاشی نظام جس میں زمین، طاقت اور سیاسی اثر و رسوخ بڑی جاگیردار اشرافیہ کے ہاتھ میں مرتکز ہو۔", "c": "Islamiat"}, {"q": "How does feudalism affect society?", "a": "معاشی عدم مساوات، power concentration، social mobility میں کمی اور patron-client relationships پیدا کر سکتا ہے۔", "c": "Islamiat"}, {"q": "How does feudalism affect democracy?", "a": "سیاسی طاقت کے محدود خاندانوں میں مرتکز ہونے، patronage اور unequal political participation کے ذریعے جمہوری اداروں کو متاثر کر سکتا ہے۔", "c": "Islamiat"}, {"q": "Difference between a subject and a citizen?", "a": "Subject تاریخی طور پر sovereign کے تابع فرد کو کہتے ہیں، جبکہ citizen ریاست کا قانونی رکن ہے جس کے حقوق اور ذمہ داریاں آئین و قانون سے متعین ہوتی ہیں۔", "c": "Governance & politics"}, {"q": "Causes of underdevelopment in Balochistan?", "a": "وسیع جغرافیہ، کم infrastructure، انسانی ترقی کی کمی، کم سرمایہ کاری، water scarcity اور historical governance/development challenges۔", "c": "Balochistan & economy"}, {"q": "What is insurgency?", "a": "ریاست کے خلاف منظم مسلح بغاوت یا ریاستی control کو چیلنج کرنے کی مسلسل کوشش۔", "c": "Security"}, {"q": "What causes youth to join terrorist organizations?", "a": "انتہاپسندانہ propaganda، social isolation، grievances، کمزور education، unemployment، coercion اور بعض اوقات مالی یا identity-related عوامل۔", "c": "Security"}, {"q": "Economic causes of radicalization?", "a": "unemployment، poverty، inequality اور economic exclusion vulnerability بڑھا سکتے ہیں، اگرچہ radicalization کی واحد وجہ معیشت نہیں۔", "c": "Islamiat"}, {"q": "Social causes of radicalization?", "a": "isolation، social exclusion، identity crisis، intolerance، extremist networks اور misinformation۔", "c": "Islamiat"}, {"q": "Political causes of insurgency?", "a": "political exclusion، grievances، weak representation، governance failures اور بعض حالات میں repression یا unresolved political disputes۔", "c": "Governance & politics"}, {"q": "How can terrorism be countered?", "a": "intelligence، effective policing، rule of law، financial disruption، border security، education، counter-narrative اور community engagement۔", "c": "Security"}, {"q": "Is military action alone sufficient to counter terrorism?", "a": "نہیں۔ military action بعض security situations میں ضروری ہو سکتی ہے، مگر long-term solution کے لیے intelligence، policing، justice، education، employment اور good governance بھی ضروری ہیں۔", "c": "Security"}, {"q": "Role of education in countering extremism?", "a": "critical thinking، tolerance، civic values، peaceful dialogue اور misinformation سے بچنے کی صلاحیت پیدا کرتی ہے۔", "c": "Security"}, {"q": "Role of employment in preventing radicalization?", "a": "dignified employment youth کو economic opportunity، social inclusion اور constructive future فراہم کرتا ہے۔", "c": "Islamiat"}, {"q": "How can youth be prevented from joining militant organizations?", "a": "education، skills، employment، sports، civic engagement، family/community awareness، online counter-narratives اور effective law enforcement۔", "c": "Security"}, {"q": "Role of intelligence in counterterrorism?", "a": "threats کی early identification، networks کی شناخت، attacks کی prevention اور law-enforcement operations کو actionable information فراہم کرنا۔", "c": "Security"}, {"q": "Role of border management in counterterrorism?", "a": "illegal crossings، arms/smuggling اور militant movement کو روکنے اور قانونی آمدورفت کو منظم کرنے میں مدد دیتا ہے۔", "c": "Security"}, {"q": "Role of development in countering insurgency?", "a": "roads، schools، hospitals، jobs، water اور governance بہتر ہونے سے grievances کم اور ریاست پر public trust بڑھ سکتا ہے۔", "c": "Security"}, {"q": "What are Fundamental Rights?", "a": "آئینِ پاکستان میں شہریوں کو دیے گئے بنیادی حقوق، مثلاً جان و آزادی، مساوات، اظہارِ رائے، مذہبی آزادی اور fair trial وغیرہ۔", "c": "Governance & politics"}, {"q": "Which Articles deal with Fundamental Rights?", "a": "آئینِ پاکستان کے Articles 8 to 28 بنیادی حقوق سے متعلق ہیں۔", "c": "Governance & politics"}, {"q": "What is Article 8?", "a": "بنیادی حقوق سے متصادم قوانین کو اس حد تک void قرار دیتا ہے جس حد تک وہ حقوق کو محدود کرتے ہوں، subject to constitutional exceptions۔", "c": "Governance & politics"}, {"q": "What is Article 9?", "a": "کسی شخص کو life یا liberty سے قانون کے مطابق ہی محروم کیا جا سکتا ہے۔", "c": "Governance & politics"}, {"q": "What is Article 10?", "a": "arrest اور detention کے safeguards فراہم کرتا ہے۔", "c": "Governance & politics"}, {"q": "What is Article 10-A?", "a": "fair trial اور due process کا حق دیتا ہے۔", "c": "Governance & politics"}, {"q": "What is Article 11?", "a": "slavery، forced labour اور human trafficking کی ممانعت کرتا ہے؛ hazardous child labour سے بھی متعلق تحفظ فراہم کرتا ہے۔", "c": "Governance & politics"}, {"q": "What is Article 14?", "a": "انسان کی dignity اور گھر کی privacy کو تحفظ دیتا ہے؛ torture for extracting evidence ممنوع ہے۔", "c": "Governance & politics"}, {"q": "What is Article 17?", "a": "association، unions/associations اور سیاسی جماعت بنانے/شامل ہونے کے حقوق سے متعلق ہے، subject to law and constitutional restrictions۔", "c": "Governance & politics"}, {"q": "What is Article 18?", "a": "lawful trade، business یا profession اختیار کرنے کا حق دیتا ہے۔", "c": "Governance & politics"}, {"q": "What is Article 19?", "a": "freedom of speech and expression اور freedom of press فراہم کرتا ہے، مگر آئینی و قانونی reasonable restrictions کے تابع۔", "c": "Governance & politics"}, {"q": "What is Article 20?", "a": "مذہب profess، practice اور propagate کرنے اور مذہبی اداروں کو manage کرنے کا حق دیتا ہے، subject to law۔", "c": "Governance & politics"}, {"q": "What is Article 25?", "a": "تمام شہریوں کی equality before law اور equal protection of law کی ضمانت دیتا ہے۔", "c": "Governance & politics"}, {"q": "What is Article 25-A?", "a": "ریاست پر 5 سے 16 سال کی عمر کے بچوں کے لیے free and compulsory education کی ذمہ داری عائد کرتا ہے۔", "c": "Governance & politics"}, {"q": "What is Article 26?", "a": "public places تک رسائی میں discrimination کے خلاف تحفظ فراہم کرتا ہے، آئینی شرائط کے ساتھ۔", "c": "Governance & politics"}, {"q": "What is Article 27?", "a": "public services میں discrimination کے خلاف safeguards فراہم کرتا ہے، constitutional exceptions کے ساتھ۔", "c": "Governance & politics"}, {"q": "Difference between Fundamental Rights and Principles of Policy?", "a": "Fundamental Rights عدالت کے ذریعے enforceable constitutional rights ہیں، جبکہ Principles of Policy ریاست کی رہنمائی کے اصول ہیں اور ان کا enforcement مختلف آئینی طریقے سے ہوتا ہے۔", "c": "Governance & politics"}, {"q": "Pakistan’s relationship with Saudi Arabia?", "a": "پاکستان اور سعودی عرب کے تعلقات تاریخی طور پر مضبوط ہیں اور مذہبی، معاشی، دفاعی، diplomatic اور people-to-people روابط پر er the 18th Amendment", "Radcliffe Award — what was it?", "Who demarcated the Iran–Pakistan border?", "Bait-ul-Maal in the time of Hazrat Umar (RA)", "When was the Universal Declaration of Human Rights adopted?", "Who is the Chief Justice of Pakistan and of the Balochistan High Court?", "Meesaq-e-Madina — its importance", "Who were Durand and Radcliffe, and where did they draw borders?", "How many fundamental-rights articles are there? Name them with article numbers.", "How much of the Earth is land and how much water — in square miles, not percent?", "When did Nelson Mandela rule South Africa?"]}, {"src": "Handwritten list · 13 Aug 2026", "q": ["Current relevance of the Two-Nation Theory", "Privatization vs nationalization", "The Makkah agreement and its effects on the region", "Balochistan's current political and economic problems and their solutions", "The system has collapsed — give your opinion", "Current situation in Kashmir and recent events", "The Quran calls us Ashraf-ul-Makhluqat, but some say we act like the lowest of creation. What do you think?", "Why is there insurgency in the Baloch belt but not in the Pashtun belt?", "Quaid-e-Azam's Fourteen Points", "Pakistan Resolution — its importance and explanation", "Largest desert of Balochistan", "Importance of Chagai and its infrastructure", "Reko Diq and Saindak in detail; Chagai and Pakistan's nuclear tests", "When was Sindh separated from Bombay?", "Reasons for the dispute between Hazrat Ali (RA) and Hazrat Muawiya (RA)", "Battle of Jamal in detail", "Discussion on insurgency in Balochistan", "On what basis were accession talks held with the Quaid, and whom did the Khan of Kalat consult before acceding?", "Pakistan's economy: imports, exports, annual deficit", "Causes of the Fall of Dhaka", "Who was the ruler (Mir) of Khairpur at independence?", "Barrages of Sindh — Guddu, Sukkur, Kotri — in detail", "Which river flows through Sindh?"]}]};

function vpool(key){
  if(key==="all"){const o=[];VV.common.forEach((tp,ti)=>tp.q.forEach((q,qi)=>o.push({id:"c"+ti+"_"+qi,q:q.q,f:q.f,tag:tp.t,by:tp.by})));return o}
  if(key==="qa")return VV.qa.map((x,i)=>({id:"qa"+i,q:x.q,a:x.a,tag:x.c+" · with model answer"}));
  if(key.startsWith("r:")){const r=VV.recent[+key.slice(2)];return r.q.map((q,i)=>({id:"r"+key.slice(2)+"_"+i,q,tag:r.src}))}
  if(key.startsWith("z:")){const z=key.slice(2);return VV.zones[z].map((q,i)=>({id:"z"+z+i,q,tag:z+" zone · Aug 2026"}))}
  const n=key.slice(2),p=VV.panels[n];return p.reps.map((r,i)=>({id:"p"+n.replace(/\W/g,"")+i,q:r[1],c:r[0],tag:"Asked "+r[0]+"× by "+n}));
}
function vstat(id){S.viva=S.viva||{};return S.viva[id]||(S.viva[id]={seen:0,ok:0,last:0,r:null})}

function startViva(key){

  pool.sort((a,b)=>a.pr-b.pr||a.last-b.last||(key==="all"?b.by-a.by:(b.c||0)-(a.c||0))||a.rnd-b.rnd);
  const items=pool.slice(0,5).sort(()=>Math.random()-.5);
  VQ={key,items,at:0,res:[]};showV();
}
function showV(){
  const it=VQ.items[VQ.at];

function rateV(r){
