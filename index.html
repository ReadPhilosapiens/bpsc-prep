<style>
:root{
  --bg:#111417;--surface:#191d21;--surface2:#21262b;--line:#2a3036;
  --text:#e9e6df;--muted:#8d939a;--accent:#7cc4a4;--accent-ink:#0e1a15;
  --warn:#d9a95b;--bad:#d97b6c;--r:16px;--accent-soft:#1e2e27;--bar:rgba(17,20,23,.94);--shadow:none;--bw:1px;color-scheme:dark;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--font)}
body{min-height:100vh;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent)}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.screen{display:none}.screen.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
.brand{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:40px}
.pill::after{content:" ▾";color:var(--muted)}
.hero{text-align:center;padding:10px 0 18px}
.ring{width:168px;height:168px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.next{font-size:19px;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:middle;font-weight:500}
.tag.h{color:var(--accent);background:var(--accent-soft)}
.main{display:block;width:100%;min-height:62px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:600;margin:6px 0 18px}
.main:active{opacity:.85}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.opt{min-height:52px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:500}
.opt:active{background:var(--line)}
.banner{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:14px}
.banner button{color:var(--accent);padding:10px 12px;font-weight:500}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
summary{list-style:none;padding:16px;min-height:54px;display:flex;justify-content:space-between;align-items:center;font-weight:500}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-size:20px}
details[open] summary::after{content:"–"}
.lines{padding:0 16px 14px;margin:0;list-style:none}
.lines li{padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.lines li:first-child{border-top:0}
.yr{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:8px;font-weight:500}
.topic{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);gap:10px;min-height:46px}
.lines .topic:first-child{border-top:0}
.st{font-size:12px;color:var(--muted);white-space:nowrap}
.st.ok{color:var(--accent)}.st.rev{color:var(--warn)}
.ch{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 16px 2px}
[data-theme=brutal] .ch{color:#111;font-weight:700}
.lvl{font-weight:600;font-size:15px;margin-top:6px}
.steps{margin:0 0 12px;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
[data-theme=brutal] .steps li::before{color:#111;border:2px solid #111;border-radius:0}
.quizcard .qmix{margin:4px 0 10px}
.qsubs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qsub{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:48px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:var(--bw) solid var(--line);font-size:14px;text-align:left}
.qsub b{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.qsub.done b{color:var(--accent)}
[data-theme=brutal] .qsub.done b{color:#111;text-decoration:underline}
.qtop{display:flex;justify-content:space-between;margin-bottom:8px}
.qbar{height:4px;border-radius:2px;background:var(--line);margin-bottom:18px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--accent)}
.qq{font-size:19px;font-weight:600;margin-bottom:16px;line-height:1.35}
.qopts{display:grid;gap:8px;margin-bottom:14px}
.qopt{min-height:52px;padding:12px 14px;border-radius:12px;background:var(--surface2);border:var(--bw) solid var(--line);text-align:left;font-size:16px}
.qopt.ok{border-color:var(--accent);background:var(--accent-soft)}
.qopt.bad{border-color:var(--bad);color:var(--bad)}
.qopt:disabled{opacity:1}
.qex{font-size:15px;color:var(--muted);margin-bottom:14px}.qex b{color:var(--text)}
.acc{display:grid;grid-template-columns:7.5em 1fr 3em;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.accbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.accbar i{display:block;height:100%}
.acc b{text-align:right;font-weight:600}
.note{color:var(--muted);font-size:13px;padding:0 16px 14px}
h2{font-size:22px;margin:4px 0 16px;font-weight:600}
.day{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px;min-height:56px}
.entry .t{font-weight:500}.entry .m{font-size:13px;color:var(--muted)}
.dots{letter-spacing:2px;color:var(--accent);white-space:nowrap;font-size:13px}
.dots i{color:var(--line);font-style:normal}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:30px;font-weight:600;letter-spacing:-.01em}
.stat span{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:64px;margin-top:8px}
.bars div{background:var(--surface2);border-radius:4px;min-height:6px}
.bars div.on{background:var(--accent)}
.blabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.btn2{display:block;width:100%;min-height:52px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;font-weight:500}
.btn2.quiet{color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:173px;min-height:58px;color:var(--muted);font-size:14px;font-weight:500}
.tabs button.on{color:var(--text)}
.tabs button.on::before{content:"";display:block;width:18px;height:3px;border-radius:2px;background:var(--accent);margin:0 auto 6px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:86vh;overflow:auto;z-index:11;transform:translateY(105%);transition:transform .22s ease,visibility .22s;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{min-height:44px;padding:10px 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:14px;text-align:left}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.sure{display:flex;justify-content:space-between;align-items:baseline}
.sure b{font-size:20px}
input[type=range]{width:100%;height:44px;-webkit-appearance:none;appearance:none;background:transparent;margin:4px 0 18px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--accent);margin-top:-12px}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:var(--accent)}
.exam{display:block;width:100%;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);margin-bottom:8px;min-height:52px}
.exam.on{border-color:var(--accent)}
.exam small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}

/* ---------- Looks ---------- */
.card,.stat,details,.entry,.pill,.btn2,.opt,.banner{box-shadow:var(--shadow)}
.card,.stat,details,.entry,.pill,.btn2,.opt,.chip,.exam{border-width:var(--bw)}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}

const KEY="bpscprep.v1";
const DAY=864e5;
let S;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save")}}

}
function sampleLogs(){

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
function dayName(t){
  const diff=Math.round((startOfDay(Date.now())-startOfDay(t))/DAY);
  if(diff===0)return"Today";if(diff===1)return"Yesterday";
  return new Date(t).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
}
const dots=n=>"●".repeat(n)+"<i>"+"●".repeat(5-n)+"</i>";

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* topic status for current exam: ok | rev | null */
function status(examId,topic){
  const ls=S.logs.filter(l=>l.exam===examId&&l.topic===topic).sort((a,b)=>b.t-a.t);
  if(!ls.length)return null;
  const l=ls[0];
  return (l.sure>=3&&l.recall!=="no"&&l.recall!=="shaky")?"ok":"rev";
}
function coverage(examId){
  const e=EXAM[examId],n=e.topics.length;
  const done=e.topics.filter(t=>status(examId,t[0])==="ok").length;
  return {done,n,pct:Math.round(done/n*100)};
}
function nextTopic(examId){
  const e=EXAM[examId],order={H:0,M:1,L:2};
  const sorted=e.topics.slice().sort((a,b)=>order[a[1]]-order[b[1]]);
  const rev=sorted.find(t=>status(examId,t[0])==="rev");
  const fresh=sorted.find(t=>status(examId,t[0])===null);
  if(fresh&&(!rev||order[fresh[1]]<order[rev[1]]))return fresh;
  if(rev)return rev;
  /* all covered: oldest studied */
  let oldest=null,ot=Infinity;
  e.topics.forEach(t=>{const l=S.logs.filter(x=>x.exam===examId&&x.topic===t[0]);const m=Math.max(...l.map(x=>x.t));if(m<ot){ot=m;oldest=t}});
  return oldest;
}
function pendingFollowUp(){
  const today=startOfDay(Date.now());
  return S.logs.filter(l=>l.recall==null&&l.t<today&&l.t>=today-3*DAY).sort((a,b)=>b.t-a.t)[0];
}

/* ---------- Render: History ---------- */
function renderHistory(){

  let html="",last="";

function qstat(id){S.qs=S.qs||{};return S.qs[id]||(S.qs[id]={seen:0,right:0,last:0})}
function pickQs(subjs,n){
  /* unseen first, then ones you got wrong, then the oldest seen */
  const pool=[];subjs.forEach(s=>QB[s].q.forEach((q,i)=>{const id=s+":"+i,st=(S.qs||{})[id]||{seen:0,right:0,last:0};
    const pr=st.seen===0?0:(st.right<st.seen?1:2);pool.push({id,s,i,pr,last:st.last,r:Math.random()})}));
  pool.sort((a,b)=>a.pr-b.pr||a.last-b.last||a.r-b.r);
  if(subjs.length===1)return pool.slice(0,n);

  return out.sort(()=>Math.random()-.5);
}

}
function finishQuiz(){
  const n=Q.items.length,pct=Math.round(Q.right/n*100);
  S.quiz=S.quiz||[];S.quiz.push({t:Date.now(),k:Q.key,n,right:Q.right,per:Q.per});save();
  let weak=null,wr=2;for(const s in Q.per){const r=Q.per[s].r/Q.per[s].n;if(r<wr){wr=r;weak=s}}
  const band=pct<50?"low":pct<80?"mid":"high",bb=BAND[band],subj=Q.key==="mix"?weak:Q.key;
  const steps=STEPS[QKIND[subj]][band];
  openSheet(`<div class="label">Today's ${Q.key==="mix"?"mixed quiz":esc(QB[Q.key].name)+" quiz"}</div>
   <div class="big" style="margin:6px 0 4px">${Q.right}/${n}</div>
   <div class="lvl" style="color:${bb[1]}">${bb[0]}${Q.key==="mix"&&weak?" · weakest: "+esc(QB[weak].name):""}</div>
   <div class="label" style="margin-top:16px">Your next 3 steps</div>
   <ol class="steps">${steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <div class="sub" style="margin:0 0 16px">Missed questions come back first next time.</div>
   <button class="main" id="qdone" style="margin:0">Done</button>`);
  Q=null;renderAll();
}

/* ---------- Sheets ---------- */
function openSheet(html){$("#sheet").innerHTML='<div class="grab"></div>'+html;$("#bg").classList.add("on");$("#sheet").classList.add("on");$("#sheet").scrollTop=0}
function closeSheet(){$("#bg").classList.remove("on");$("#sheet").classList.remove("on")}
function openLog(topic){
  const e=EXAM[S.exam];
  openSheet(`<div class="label">What did you study?</div>
   <div class="chips">${e.topics.map(t=>`<button class="chip${t[0]===topic?" on":""}" data-chip="${esc(t[0])}">${esc(t[0])}</button>`).join("")}</div>
   <div class="sure"><span class="label">How sure are you now?</span><b id="sureLbl">${SURE[3]}</b></div>
   <input type="range" id="sure" min="1" max="5" step="1" value="3" aria-label="How sure">
   <button class="main" id="saveLog" style="margin:0">Save</button>`);
  $("#sheet").dataset.topic=topic;
}
function openExams(){
  let html='<div class="label">Your exam</div>',g="";
  EXAMS.forEach(e=>{if(e.group!==g&&e.group.startsWith("Lecturer")&&!g.startsWith("Lecturer"))html+='<div class="day">Lecturer BS-17</div>';g=e.group;
    html+=`<button class="exam${e.id===S.exam?" on":""}" data-exam="${e.id}">${esc(e.name)}${e.group.startsWith("Lecturer")?"":`<small>${esc(e.group)}</small>`}</button>`});
  openSheet(html);
}

/* ---------- Events ---------- */
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.s){document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
    document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("on",x.id==="s-"+b.dataset.s));window.scrollTo(0,0);return}
  if(b.id==="logBtn")return openLog(b.dataset.topic);
  if(b.dataset.topic&&b.classList.contains("topic"))return openLog(b.dataset.topic);
  if(b.id==="examPill")return openExams();
  if(b.dataset.exam){S.exam=b.dataset.exam;save();closeSheet();renderAll();return}
  if(b.dataset.chip){document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));$("#sheet").dataset.topic=b.dataset.chip;return}
  if(b.id==="saveLog"){
    const topic=$("#sheet").dataset.topic,sure=+$("#sure").value;
    const l={id:uid(),t:Date.now(),exam:S.exam,topic,sure,recall:null};
    S.logs.push(l);save();renderAll();openImprove(l);return}
  if(b.dataset.r){const f=pendingFollowUp();if(f){f.recall=b.dataset.r;save();renderAll();if(b.dataset.r==="yes")toast("Locked in");else openImprove(f)}return}
  if(b.id==="gotIt"){closeSheet();toast("Saved · ask again tomorrow");return}
  if(b.dataset.improve){const l=latestLog(b.dataset.improve);if(l)openImprove(l,`<button class="main" data-relog="${esc(l.topic)}" style="margin:0">Log study</button>`);return}
  if(b.dataset.relog)return openLog(b.dataset.relog);
  if(b.dataset.del){const l=S.logs.find(x=>x.id===b.dataset.del);if(l&&confirm("Delete this entry?")){S.logs=S.logs.filter(x=>x!==l);save();closeSheet();renderAll()}return}
  if(b.id==="clearSample"){if(confirm("Clear the sample week?")){S.logs=S.logs.filter(l=>!l.sample);save();renderAll();toast("Samples cleared")}return}
  if(b.classList.contains("entry")){const l=S.logs.find(x=>x.id===b.dataset.id);
    if(l)openImprove(l,`<button class="main" id="gotIt2" style="margin:0 0 8px">Got it</button><button class="btn2 quiet" data-del="${esc(l.id)}">Delete entry</button>`);return}
  if(b.id==="gotIt2"){closeSheet();return}
  if(b.dataset.quiz)return startQuiz(b.dataset.quiz);
  if(b.dataset.opt!=null&&b.classList.contains("qopt"))return answer(+b.dataset.opt);
  if(b.id==="qnext"){if(Q.at<Q.items.length-1){Q.at++;showQ()}else finishQuiz();return}
  if(b.id==="qdone"){closeSheet();return}
  if(b.dataset.look){S.theme=b.dataset.look;save();applyLook();return}
  if(b.id==="backupBtn")return backup();
  if(b.id==="restoreBtn")return $("#restoreFile").click();
});
$("#bg").addEventListener("click",closeSheet);
document.addEventListener("input",ev=>{if(ev.target.id==="sure")$("#sureLbl").textContent=SURE[ev.target.value]});

/* ---------- Backup / Restore ---------- */
async function backup(){
  const d=new Date(),name=`bpsc-prep-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  try{const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"BPSC Prep backup"});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Backup saved");
}
$("#restoreFile").addEventListener("change",ev=>{
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.logs))throw 0;
      const logs=d.logs.filter(l=>l&&typeof l.topic==="string"&&typeof l.t==="number").map(l=>({id:String(l.id||uid()),t:l.t,exam:String(l.exam||"pcs"),topic:l.topic,sure:Math.min(5,Math.max(1,+l.sure||3)),recall:["yes","shaky","no"].includes(l.recall)?l.recall:null,sample:!!l.sample}));
      if(!confirm("Replace your data with this backup ("+logs.length+" entries)?"))return;
      S={v:1,qs:(d.qs&&typeof d.qs==="object")?d.qs:{},quiz:Array.isArray(d.quiz)?d.quiz.filter(r=>r&&typeof r.t==="number"):[],exam:EXAM[d.exam]?d.exam:"pcs",theme:LOOKS.some(l=>l[0]===d.theme)?d.theme:(S.theme||"minimal"),logs};save();renderAll();toast("Restored")}
    catch(e){toast("That file isn't a backup")}
    ev.target.value=""};
  r.readAsText(f);
});

load();renderAll();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
